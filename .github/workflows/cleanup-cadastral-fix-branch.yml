name: Cleanup cadastral fix branch

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'agent/fix-cadastral-auto-tep'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Remove temporary development files
        shell: bash
        run: |
          rm -f .github/trigger-*.txt
          rm -f .github/workflows/apply-cadastral-auto-tep-fix.yml
          rm -f .github/workflows/inspect-genplan-endpoints.yml
          rm -f scripts/fix_cadastral_auto_tep.py
          rm -f genplan_endpoint_contexts.txt genplan_module_structure.txt
          rm -f calc_module_inspection.txt calc_core_report.txt domain_calc_report.txt
          rm -f headless_tep_test.json auto_tep_validation.json auto_tep_validation_error.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'Branch already clean.'
            exit 0
          fi
          git commit -m 'Clean temporary validation files'
          git push origin HEAD:${{ github.head_ref }}
