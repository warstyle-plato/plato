name: Inspect Genplan calculator endpoints

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  inspect:
    if: github.head_ref == 'agent/fix-cadastral-auto-tep'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Validate patched automatic cadastral TEP
        shell: bash
        run: |
          python -m pip install -q -r requirements.txt
          python - <<'PY'
          import json
          from pathlib import Path
          import main

          rows = main._telegram_collect_genplan_rows(['77:09:0004014:13'], 0.6509)
          parsed = main.import_cadastral_tep(main.CadastralTepRequest(
              rows=rows,
              cadastral_analysis={
                  'recognized':['77:09:0004014:13'],
                  'territory':{
                      'area_ha':0.6509,
                      'district':'Савеловский',
                      'cadastral_quarter':'77:09:0004014',
                      'parcel_count':1,
                  },
                  'coefficients':{},
              },
          ))
          data = main._telegram_cadastral_data_from_parsed(
              parsed,
              {'territory':{'area_ha':0.6509,'district':'Савеловский','cadastral_quarter':'77:09:0004014'}},
              ['77:09:0004014:13'],
          )
          result = {
              'ok': True,
              'version': main.app.version,
              'rows_count': len(rows),
              'has_tep': bool(parsed.get('tep')),
              'summary': parsed.get('summary'),
              'data': {k:data.get(k) for k in [
                  'site_area_ha','district','apartments_saleable_sqm','commercial_saleable_sqm',
                  'parking_spaces','land_rights_cost_mln','social_compensation_mln'
              ]},
          }
          assert main.app.version == '0.12.20'
          assert len(rows) >= 60
          assert result['has_tep']
          assert data.get('apartments_saleable_sqm',0) > 0
          Path('auto_tep_validation.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add auto_tep_validation.json
          git commit -m 'Validate automatic cadastral TEP flow' || true
          git push origin HEAD:${{ github.head_ref }}
