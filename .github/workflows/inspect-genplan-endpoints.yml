name: Inspect Genplan calculator endpoints

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  inspect:
    if: github.head_ref == 'agent/fix-cadastral-auto-tep'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Validate patched automatic cadastral TEP
        shell: bash
        run: |
          python -m pip install -q -r requirements.txt
          set +e
          python - <<'PY' > /tmp/validate.log 2>&1
          import json, traceback
          from pathlib import Path
          try:
              import main
              rows = main._telegram_collect_genplan_rows(['77:09:0004014:13'], 0.6509)
              parsed = main.import_cadastral_tep(main.CadastralTepRequest(
                  rows=rows,
                  cadastral_analysis={
                      'recognized':['77:09:0004014:13'],
                      'territory':{
                          'area_ha':0.6509,
                          'district':'Савеловский',
                          'cadastral_quarter':'77:09:0004014',
                          'parcel_count':1,
                      },
                      'coefficients':{},
                  },
              ))
              data = main._telegram_cadastral_data_from_parsed(
                  parsed,
                  {'territory':{'area_ha':0.6509,'district':'Савеловский','cadastral_quarter':'77:09:0004014'}},
                  ['77:09:0004014:13'],
              )
              result = {
                  'ok': True,
                  'version': main.app.version,
                  'rows_count': len(rows),
                  'parsed_keys': sorted(parsed.keys()),
                  'has_tep': bool(parsed.get('tep') or (parsed.get('mappings') or {}).get('tep')),
                  'summary': parsed.get('summary'),
                  'normalized': parsed.get('normalized'),
                  'data': data,
              }
              assert main.app.version == '0.12.20'
              assert len(rows) >= 60
              assert result['has_tep']
              Path('auto_tep_validation.json').write_text(json.dumps(result,ensure_ascii=False,indent=2,default=str),encoding='utf-8')
              print(json.dumps(result,ensure_ascii=False,default=str))
          except Exception:
              text=traceback.format_exc()
              Path('auto_tep_validation_error.txt').write_text(text,encoding='utf-8')
              print(text)
              raise
          PY
          rc=$?
          set -e
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add auto_tep_validation.json auto_tep_validation_error.txt 2>/dev/null || true
          git commit -m 'Capture automatic cadastral TEP validation' || true
          git push origin HEAD:${{ github.head_ref }} || true
          cat /tmp/validate.log
          exit "$rc"
