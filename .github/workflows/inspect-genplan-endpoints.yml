name: Inspect Genplan calculator endpoints

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  inspect:
    if: github.head_ref == 'agent/fix-cadastral-auto-tep'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Extract concise endpoint and calculator contexts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          out=[]
          tokens=['glavapu','stroimprosto','fetch(','cad_numbers','cadZU','id-cad-numbers-text-field','Перейти к расчётам','calcParams','terrArea','district','coeff_mpt','coeff_rent']
          for p in Path('genplan_assets').glob('*.js'):
              s=p.read_text(encoding='utf-8',errors='ignore')
              out.append('### '+p.name)
              urls=[]
              for u in re.findall(r'https?://[^"\'`\\\s)]+',s):
                  if u not in urls: urls.append(u)
              for u in urls[:100]: out.append('URL '+u[:500])
              for token in tokens:
                  start=0; count=0
                  while count<40:
                      i=s.find(token,start)
                      if i<0: break
                      ctx=re.sub(r'\s+',' ',s[max(0,i-220):min(len(s),i+520)])
                      out.append('CTX '+token+' :: '+ctx[:900])
                      start=i+len(token); count+=1
          Path('genplan_endpoint_contexts.txt').write_text('\n'.join(out)[:800000],encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add genplan_endpoint_contexts.txt
          git commit -m 'Refine Genplan endpoint contexts' || true
          git push origin HEAD:${{ github.head_ref }}
