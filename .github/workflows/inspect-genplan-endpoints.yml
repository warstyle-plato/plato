name: Inspect Genplan calculator endpoints

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  inspect:
    if: github.head_ref == 'agent/fix-cadastral-auto-tep'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Extract calculator module structure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          out=[]
          for p in sorted(Path('genplan_assets').glob('*.js')):
              s=p.read_text(encoding='utf-8',errors='ignore')
              out.append('### '+p.name)
              out.append('LEN '+str(len(s)))
              out.append('HEAD '+s[:3000].replace('\n',' '))
              out.append('TAIL '+s[-5000:].replace('\n',' '))
              for m in re.finditer(r'export\s*\{([^}]*)\}',s):
                  out.append('EXPORT '+m.group(1)[:5000])
              for m in re.finditer(r'import\s*\{([^}]*)\}\s*from\s*["\']([^"\']+)',s):
                  out.append('IMPORT '+m.group(2)+' :: '+m.group(1)[:3000])
              # Contexts around calculation class/function signatures and API-ish constants.
              for token in ['calcParams=e=>','calcParams=', 'final_cost_of_change_vri','costOfChangeVRI','class ', 'new class', 'cadZU:', 'analysis:', 'calcMode:', 'socialParameters']:
                  start=0; count=0
                  while count<15:
                      i=s.find(token,start)
                      if i<0: break
                      ctx=s[max(0,i-1500):min(len(s),i+5000)].replace('\n',' ')
                      out.append('CTX '+token+' :: '+ctx)
                      start=i+len(token); count+=1
          Path('genplan_module_structure.txt').write_text('\n\n'.join(out)[:3000000],encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add genplan_module_structure.txt
          git commit -m 'Inspect Genplan module structure' || true
          git push origin HEAD:${{ github.head_ref }}
