name: Inspect Genplan calculator endpoints

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  inspect:
    if: github.head_ref == 'agent/fix-cadastral-auto-tep'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Extract API literals
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          out=[]
          for p in sorted(Path('genplan_assets').glob('*.js')):
              s=p.read_text(encoding='utf-8',errors='ignore')
              strings=[]
              # collect quoted/template literals up to 500 chars
              for m in re.finditer(r'(["\'`])((?:\\.|(?!\1).){1,500})\1',s):
                  val=m.group(2)
                  low=val.lower()
                  if any(k in low for k in ['api','cad','quarter','district','analy','calc','geojson','polygon','territory','upks','mpt']):
                      strings.append(val)
              if strings:
                  out.append('### '+p.name)
                  seen=[]
                  for x in strings:
                      if x not in seen: seen.append(x)
                  out.extend(seen[:1500])
          Path('genplan_api_literals.txt').write_text('\n'.join(out)[:1500000],encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add genplan_api_literals.txt
          git commit -m 'Extract Genplan API literals' || true
          git push origin HEAD:${{ github.head_ref }}
