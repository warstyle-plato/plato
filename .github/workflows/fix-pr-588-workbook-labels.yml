name: Fix PR 588 workbook glossary labels

on:
  push:
    branches:
      - 'claude/terms-glossary'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore glossary labels lost while merging main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          python - <<'PY'
          from pathlib import Path

          path = Path('main_legacy.py')
          text = path.read_text(encoding='utf-8')

          replacements = {
              '("ТЭП", "A36", "ИТОГО ПРОЕКТ", "ИТОГО ПРОЕКТ — строительный объём"),':
                  '("ТЭП", "A36", "ИТОГО ПРОЕКТ", f"ИТОГО ПРОЕКТ — {TOTAL_AREA.lower()}"),',
              '("ОТЧЕТ", "F6", "ГНС", "Строительный объём"),':
                  '("ОТЧЕТ", "F6", "ГНС", TOTAL_AREA.name),',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected workbook label not found: {old}')
              text = text.replace(old, new, 1)

          required = [
              '("ТЭП", "A36", "ИТОГО ПРОЕКТ", f"ИТОГО ПРОЕКТ — {TOTAL_AREA.lower()}"),',
              '("ОТЧЕТ", "F6", "ГНС", TOTAL_AREA.name),',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit('glossary labels were not restored: ' + repr(missing))

          path.write_text(text, encoding='utf-8')
          PY

          python -m py_compile main_legacy.py terms_glossary.py
          git rm .github/workflows/fix-pr-588-workbook-labels.yml
          git add main_legacy.py
          git diff --cached --check
          git commit -m 'Fix workbook glossary labels after #584 merge'
          git push origin HEAD:claude/terms-glossary
