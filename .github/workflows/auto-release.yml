name: Выпуск принятых задач

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_run:
    workflows: ["Тесты на PR", "Версия ветки выше main"]
    types: [completed]

concurrency:
  group: approved-release-queue
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: write # Only control/release-dispatched; never grants approval.
  actions: write # Dispatch the existing trusted release-merge workflow.

jobs:
  queue:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Проверить допуск и запустить штатный выпуск
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CONTROL_ACTORS: ${{ vars.RELEASE_CONTROL_ACTORS }}
        run: python3 scripts/auto_release.py
