name: DevelopAid MacBook preview

on:
  push:
    branches: [codex/developaid-desktop]
    paths:
      - 'desktop/**'
      - 'desktop.spec'
      - 'desktop_entry.py'
      - 'desktop_reference_pack.py'
      - 'requirements*.txt'
      - '.github/workflows/desktop-macos-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-macos-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macbook:
    if: github.ref == 'refs/heads/codex/developaid-desktop'
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt
      - name: Check native Apple Silicon Python
        run: python -c 'import platform; assert platform.system() == "Darwin" and platform.machine() == "arm64", platform.platform()'
      - name: Install build dependencies
        run: python -m pip install -r requirements-desktop.txt
      - name: Build DevelopAid.app
        run: python -m PyInstaller --noconfirm --clean desktop.spec
      - name: Verify application and packaged calculation
        env:
          DEVELOPAID_DESKTOP_DATA: ${{ runner.temp }}/developaid-mac-preview
        run: |
          lipo dist/DevelopAid.app/Contents/MacOS/DevelopAid -verify_arch arm64
          codesign --verify --deep --strict dist/DevelopAid.app
          dist/DevelopAid.app/Contents/MacOS/DevelopAid --smoke
          python -c 'import json,os,pathlib; p=pathlib.Path(os.environ["DEVELOPAID_DESKTOP_DATA"])/"smoke.json"; s=json.loads(p.read_text()); assert s["ok"] and set(s["exports"]) == {"pdf", "xlsx"}'
      - name: Archive application preserving permissions
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/DevelopAid.app dist/DevelopAid-MacBook.zip
          shasum -a 256 dist/DevelopAid-MacBook.zip > dist/DevelopAid-MacBook.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: DevelopAid-MacBook-AppleSilicon
          path: |
            dist/DevelopAid-MacBook.zip
            dist/DevelopAid-MacBook.zip.sha256
          if-no-files-found: error
          retention-days: 14
