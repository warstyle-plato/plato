name: Apply DevelopAid v0.12.26 fixes

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/apply_v01226.py'
      - '.github/workflows/fix-excel-template-download.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch main.py
        run: python .github/scripts/apply_v01226.py

      - name: Validate Python
        run: python -m py_compile main.py

      - name: Commit patched application
        run: |
          git config user.name "DevelopAid Bot"
          git config user.email "actions@users.noreply.github.com"
          git add main.py
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "DevelopAid v0.12.26: fix Excel template delivery"
          git push origin HEAD:main
