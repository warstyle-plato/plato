name: Windows desktop
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/windows/**', '.github/workflows/windows-desktop.yml']
  pull_request:
    paths: ['desktop/windows/**', '.github/workflows/windows-desktop.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build Windows client
        shell: powershell
        run: ./desktop/windows/build.ps1
      - name: Check native WebView2 startup and session storage
        shell: powershell
        run: |
          & ./desktop/windows/.venv/Scripts/python.exe ./desktop/windows/smoke_test.py
          if ($LASTEXITCODE -ne 0) { throw 'Native WebView2 smoke check failed' }
      - uses: actions/upload-artifact@v7
        with:
          name: DevelopAid-Windows-x64
          path: desktop/windows/dist/DevelopAid-Windows-x64.zip
          if-no-files-found: error
