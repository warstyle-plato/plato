name: Apply minimal cadastral pricing patch

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/minimal-cadastral-pricing-smr'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply patch and validate
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          if [ -f scripts/minimal_cadastral_followup.py ]; then
            python scripts/minimal_cadastral_followup.py
            python -m py_compile main.py
            rm -f scripts/minimal_cadastral_followup.py
            git add -A
            git commit -m 'Preserve cadastral pricing settings through result flow'
            git push origin HEAD:${{ github.head_ref }}
            exit 0
          fi

          if [ ! -f scripts/minimal_cadastral_pricing_v2.py ]; then
            echo 'Minimal patch already applied.'
            python -m py_compile main.py
            exit 0
          fi

          set +e
          (
            python scripts/minimal_cadastral_pricing_v2.py
            rc=$?; [ "$rc" -eq 0 ] || exit "$rc"
            python -m py_compile main.py
            rc=$?; [ "$rc" -eq 0 ] || exit "$rc"
            python - <<'PY'
          import re
          code=open('main.py',encoding='utf-8').read()
          m=re.search(r'FastAPI\(title="PLATO Development Investment Model", version="([^"]+)"\)',code)
          assert m and m.group(1)=='0.12.16'
          assert 'flow_cad_class_comfort' in code
          assert 'calc_overrides' in code
          assert 'smr_th_per_sqm' in code
          assert 'async function obtainCadastralTep()' in code
          assert "fetch('/cadastral/tep-from-calculator'" in code
          assert 'await obtainCadastralTep();' in code
          assert 'await applyGlavapu();' in code
          assert 'pyppeteer' not in code
          print('PATCH_OK',m.group(1))
          PY
          ) > /tmp/minimal-patch.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            cp /tmp/minimal-patch.log .github/minimal-patch-error.txt
            git add .github/minimal-patch-error.txt
            git commit -m 'Capture minimal cadastral patch error' || true
            git push origin HEAD:${{ github.head_ref }} || true
            cat /tmp/minimal-patch.log
            exit "$rc"
          fi
          rm -f .github/minimal-patch-error.txt .github/minimal-patch-trigger-*.txt
          rm -f scripts/minimal_cadastral_pricing_patch.py scripts/minimal_cadastral_pricing_v2.py
          git add -A
          git commit -m 'Add class prices and SMR to cadastral Telegram flow'
          git push origin HEAD:${{ github.head_ref }}
