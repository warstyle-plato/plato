name: Apply minimal cadastral pricing patch

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/minimal-cadastral-pricing-smr'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply minimal patch and validate
        shell: bash
        run: |
          python scripts/minimal_cadastral_pricing_patch.py
          python -m py_compile main.py
          python - <<'PY'
          import main
          assert main.app.version == '0.12.16'
          assert 'flow_cad_class_comfort' in open('main.py',encoding='utf-8').read()
          assert 'calc_overrides' in open('main.py',encoding='utf-8').read()
          print('PATCH_OK', main.app.version)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f scripts/minimal_cadastral_pricing_patch.py
          git add -A
          git commit -m 'Add class prices and SMR to cadastral Telegram flow'
          git push origin HEAD:${{ github.head_ref }}
