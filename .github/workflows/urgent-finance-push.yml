name: Urgent finance push runner

on:
  push:
    branches:
      - urgent/finance-corrections-v01219

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply urgent finance corrections to main
        shell: bash
        run: |
          test -f scripts/rename_pf_add_expenses.py
          python scripts/rename_pf_add_expenses.py
          python -m py_compile main.py
          python - <<'PY'
          from pathlib import Path
          c=Path('main.py').read_text(encoding='utf-8')
          assert 'version="0.12.19"' in c
          assert 'debt_capex[project_start] = max' not in c
          assert 'cash_revenue_to_equity' in c
          assert 'peak_uncovered_pf' in c
          assert 'Пиковая (непокрытая эскроу) задолженность ПФ' in c
          assert 'расходы всего' in c
          print('URGENT_FINANCE_VALIDATED')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f scripts/rename_pf_add_expenses.py
          rm -f .github/workflows/urgent-finance-push.yml
          rm -f .github/workflows/urgent-finance-pr.yml
          rm -f .github/workflows/apply-pf-expenses-on-reopen.yml
          rm -f .github/workflows/apply-pf-expenses-main.yml
          rm -f .github/workflows/apply-pf-expenses-fix.yml
          rm -f .github/workflows/apply-pf-expenses-on-comment.yml
          git add -A
          git commit -m 'DevelopAid v0.12.19: urgent finance corrections'
          git push origin HEAD:main
