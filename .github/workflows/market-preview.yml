# Автоматическая preview-выкладка только для рыночной ветки; production не затрагивается.
name: Market preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "market_search/**"
      - "main_registry.py"
      - "tests/test_market_discovery*.py"
      - "tests/test_market_preview_deploy.py"
      - "deploy-market-preview.sh"
      - ".github/workflows/market-preview.yml"
  workflow_dispatch:

concurrency:
  group: market-preview
  cancel-in-progress: true

env:
  IMAGE_NAME: developaid

jobs:
  test:
    name: Проверка рыночного модуля
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Зависимости
        run: python -m pip install -r requirements-dev.txt
      - name: Синтаксис и unit-тесты
        run: |
          python -m py_compile market_search/*.py market_search/providers/*.py main_registry.py
          python -m pytest \
            tests/test_market_discovery.py \
            tests/test_market_discovery_ui.py \
            tests/test_market_preview_deploy.py -q
      - name: Интеграция с основным entrypoint
        run: |
          python - <<'PY'
          import main_registry
          paths = {getattr(route, "path", None) for route in main_registry.app.routes}
          assert "/market/discovery" in paths
          assert 'data-tab="marketDiscovery"' in main_registry.core.PAGE
          PY

  build:
    name: Сборка preview-образа
    runs-on: ubuntu-latest
    needs: [test]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref == 'agent/market-domrf-search-v3')
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Тег preview
        id: meta
        run: |
          sha=$(git rev-parse --short=7 HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=market-$sha" >> "$GITHUB_OUTPUT"

      - name: IAM-токен по OIDC
        id: oidc
        if: ${{ vars.YC_WORKLOAD_FEDERATION_ID != '' }}
        uses: yc-actions/yc-iam-token-fed@v1
        with:
          yc-sa-id: ${{ vars.YC_SA_ID }}
          yc-federation-id: ${{ vars.YC_WORKLOAD_FEDERATION_ID }}

      - name: Вход в Yandex Registry
        run: |
          if [ -n "${{ steps.oidc.outputs.token }}" ]; then
            echo "${{ steps.oidc.outputs.token }}" \
              | docker login --username iam --password-stdin cr.yandex
          elif [ -n "${{ secrets.YC_SA_KEY }}" ]; then
            printf '%s' '${{ secrets.YC_SA_KEY }}' \
              | docker login --username json_key --password-stdin cr.yandex
          else
            echo "Нет OIDC-федерации и резервного YC_SA_KEY." >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Собрать и опубликовать готовый образ
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            INSTALL_BROWSER=0
            GIT_COMMIT=${{ steps.meta.outputs.sha }}
          tags: cr.yandex/${{ secrets.YC_REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=market-preview
          cache-to: type=gha,mode=max,scope=market-preview

  deploy:
    name: Заменить стенд на 8081
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 20
    steps:
      - name: Скачать готовый образ и поднять preview
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CORE_HOST }}
          username: ${{ secrets.CORE_USER }}
          key: ${{ secrets.CORE_SSH_KEY }}
          script_stop: true
          script: |
            set -eu
            cd ~/plato
            git fetch --quiet origin agent/market-domrf-search-v3
            git show origin/agent/market-domrf-search-v3:deploy-market-preview.sh > /tmp/deploy-market-preview.sh
            chmod 700 /tmp/deploy-market-preview.sh
            DEVELOPAID_ROOT="$HOME/plato" \
              sh /tmp/deploy-market-preview.sh \
              "${{ needs.build.outputs.tag }}" \
              "${{ needs.build.outputs.sha }}"

      - name: Адрес стенда
        run: |
          echo "Preview обновлён готовым образом ${{ needs.build.outputs.tag }}."
          echo "Проверка: http://${{ secrets.CORE_HOST }}:8081/"
