name: Apply edit mode branding fix

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/fix-edit-mode-branding'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply and validate
        shell: bash
        run: |
          python scripts/fix_edit_mode_branding.py
          python -m py_compile main.py
          python - <<'PY'
          import re
          from pathlib import Path
          code=Path('main.py').read_text(encoding='utf-8')
          m=re.search(r'version="([^"]+)"',code)
          assert m and m.group(1)=='0.12.17', m.group(1) if m else 'missing'
          assert 'PLATO' not in code
          assert 'Расчёт DevelopAid готов' in code
          assert 'mode="edit"' in code
          assert "if(telegramMode==='edit')" in code
          assert 'persistLocalSilently()' in code
          assert 'await obtainCadastralTep();' in code
          assert 'calculate()};' in code
          print('VALIDATION_OK',m.group(1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f scripts/fix_edit_mode_branding.py
          git add -A
          git commit -m 'Fix editable model launch and DevelopAid branding'
          git push origin HEAD:${{ github.head_ref }}
