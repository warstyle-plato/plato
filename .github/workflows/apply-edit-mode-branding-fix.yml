name: Apply edit mode branding fix

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/fix-edit-mode-branding'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply and validate
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/fix_edit_mode_branding.py')
          t=p.read_text(encoding='utf-8')

          old='''# Persist the exact model state before returning the summary to Telegram.\nold = "  const payload={\\n    cadastral_numbers:cads,"\nnew = "  persistLocalSilently();\\n  const payload={\\n    cadastral_numbers:cads,"\nif old not in s:\n    raise SystemExit('sendTelegramResult payload anchor not found')\ns = s.replace(old, new, 1)\n'''
          new='''# Persist the exact model state before returning the summary to Telegram.\nmatch = re.search(r"(\\n[ \\t]*const manual=!!manualMeta;\\n)", s)\nif not match:\n    raise SystemExit('sendTelegramResult manual regex anchor not found')\ninsert_at = match.end()\ns = s[:insert_at] + "  persistLocalSilently();\\n" + s[insert_at:]\n'''
          if old not in t:
              raise SystemExit('Patch-script persistence block not found')
          t=t.replace(old,new,1)

          start=t.index('# In edit mode, loadLocal()')
          end=t.index('# Marker and sanity checks.',start)
          init_patch='''# In edit mode, loadLocal() has already restored the last calculated state.\n# Insert the edit branch immediately before the existing telegramCad branch; do not rewrite that proven branch.\ncalc_match = re.search(r"([ \\t]*if\\(telegramCad\\)\\{.*?\\n[ \\t]*\\}\\n)([ \\t]*if\\(sessionData\\.manual_tep\\))", s, flags=re.S)\nif not calc_match:\n    raise SystemExit('initializeTelegramLaunch telegramCad regex block not found')\nindent = re.match(r"[ \\t]*", calc_match.group(1)).group(0)\nedit_block = indent + "if(telegramMode==='edit'){\\n" + indent + " // Reopen the exact locally persisted model state; never restart cadastral/ГлавАПУ calculation.\\n" + indent + " applyTelegramCalcOverrides();\\n" + indent + " renderInputs();\\n" + indent + " renderTep();\\n" + indent + " renderPhasing();\\n" + indent + " syncProjectClassSelector();\\n" + indent + " openTab('inputs');\\n" + indent + " await calculate();\\n" + indent + " return;\\n" + indent + "}\\n"\ns = s[:calc_match.start()] + edit_block + calc_match.group(1) + calc_match.group(2) + s[calc_match.end():]\n\n'''
          t=t[:start]+init_patch+t[end:]
          p.write_text(t,encoding='utf-8')
          PY

          set +e
          (
            python scripts/fix_edit_mode_branding.py
            rc=$?; [ "$rc" -eq 0 ] || exit "$rc"
            python -m py_compile main.py
            rc=$?; [ "$rc" -eq 0 ] || exit "$rc"
            python - <<'PY'
          import re
          from pathlib import Path
          code=Path('main.py').read_text(encoding='utf-8')
          m=re.search(r'version="([^"]+)"',code)
          assert m and m.group(1)=='0.12.17', m.group(1) if m else 'missing'
          assert 'PLATO' not in code
          assert 'Расчёт DevelopAid готов' in code
          assert 'mode="edit"' in code
          assert "if(telegramMode==='edit')" in code
          assert 'persistLocalSilently()' in code
          assert 'await obtainCadastralTep();' in code
          assert 'calculate()};' in code
          print('VALIDATION_OK',m.group(1))
          PY
          ) > /tmp/edit-mode-fix.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            cp /tmp/edit-mode-fix.log .github/edit-mode-fix-error.txt
            git add .github/edit-mode-fix-error.txt
            git commit -m 'Capture edit-mode patch error' || true
            git push origin HEAD:${{ github.head_ref }} || true
            cat /tmp/edit-mode-fix.log
            exit "$rc"
          fi
          rm -f .github/edit-mode-fix-error.txt .github/edit-mode-fix-trigger*.txt
          rm -f scripts/fix_edit_mode_branding.py
          git add -A
          git commit -m 'Fix editable model launch and DevelopAid branding'
          git push origin HEAD:${{ github.head_ref }}
