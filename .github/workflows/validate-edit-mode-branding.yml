name: Validate edit mode branding

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

jobs:
  validate:
    if: github.head_ref == 'agent/fix-edit-mode-branding'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Validate Python and rendered JavaScript
        shell: bash
        run: |
          python -m py_compile main.py
          python -m pip install -q -r requirements.txt
          python - <<'PY'
          import re
          from pathlib import Path
          code=Path('main.py').read_text(encoding='utf-8')
          assert 'PLATO' not in code
          assert 'Расчёт DevelopAid готов' in code
          assert 'mode="edit"' in code
          assert "const telegramMode=TELEGRAM_HASH_PARAMS.get('mode')||'calc';" in code
          assert "if(telegramMode==='edit')" in code
          assert 'persistLocalSilently();' in code
          assert 'await obtainCadastralTep();' in code
          assert 'calculate()};' in code
          import main
          page=main.PAGE
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',page,flags=re.S|re.I)
          assert scripts
          Path('/tmp/app.js').write_text(scripts[-1],encoding='utf-8')
          print('RENDERED_VALIDATION_OK',main.app.version)
          PY
          node --check /tmp/app.js
