name: Безопасность

# Две проверки, которых раньше не было вовсе (аудит 23.10.2026,
# docs/security_audit_2026-10-23.md):
#
# - pip-audit: известные уязвимости в зависимостях. Падает ТОЛЬКО на тех, у
#   которых есть исправленная версия, — её можно поставить. Уязвимость без
#   исправления называется предупреждением в сводке прогона, но сборку не
#   роняет: красное из-за того, что от нас не зависит, учит не смотреть на
#   красное (scripts/pip_audit_gate.py).
# - gitleaks: ключи и токены в коде. На PR проверяются только коммиты этого PR:
#   история уже просмотрена при аудите, и старая находка не должна ронять
#   чужую работу. Исключения — .gitleaks.toml.
#
# Отдельно от «Тестов на PR»: эти проверки идут минуту и не ждут долей.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  schedule:
    # Понедельник, 06:20 МСК: новая уязвимость появляется в базе, а не в нашем
    # коде, и PR о ней не узнает.
    - cron: "20 3 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pip-audit:
    name: Уязвимости в зависимостях
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ставим pip-audit
        run: python -m pip install "pip-audit==2.10.1"
      - name: Проверяем точные версии прода и тестов
        run: |
          # Оба файла — точные версии с контрольными суммами (pip-compile), и
          # проверяются ровно они, без установки и без нового подбора версий
          # (--disable-pip): что в файле, то и на проде. Файла два, потому что
          # networkx в них разный (см. requirements-dev.in).
          # Код выхода pip-audit не решает: он ненулевой на любой находке,
          # включая ту, которую исправить нечем. Решает разбор отчёта.
          status=0
          for file in requirements.txt requirements-dev.txt; do
            echo "== ${file}"
            # Отчёт прошлого файла не должен сойти за отчёт этого.
            rm -f audit.json
            pip-audit -r "${file}" --require-hashes --disable-pip \
              --format json -o audit.json --progress-spinner off || true
            python3 scripts/pip_audit_gate.py audit.json || status=$?
          done
          exit "${status}"

  secrets:
    name: Ключи и токены в коде
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.28.0"
      # Контрольная сумма архива с той же страницы выпуска: скачанный бинарник
      # без сверки — чужой код в проверке, которая ищет чужое.
      GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ставим gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
      - name: Ищем ключи в коммитах PR
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # --redact: найденное значение в журнал не попадает — журнал CI
          # читают многие, и сам журнал не должен стать утечкой.
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner \
            --log-opts="${BASE}..${HEAD}" --exit-code 1
