name: Apply DevelopAid v0.12.19

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
permissions:
  contents: write
concurrency:
  group: apply-v01219-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  patch:
    if: github.head_ref == 'agent/developaid-v01219-cadastral-bot-flow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply and validate
        shell: bash
        run: |
          python scripts/agent_patch.py
          python -m py_compile main.py
          python - <<'PY'
          import main
          assert main.app.version == '0.12.19'
          # Ensure the live (last-defined) cadastral handler no longer creates a WebApp button.
          import inspect
          src=inspect.getsource(main._telegram_handle_cadastral_numbers)
          assert '_telegram_web_app_url' not in src and 'Получить ТЭП и открыть' not in src
          menu=inspect.getsource(main._telegram_project_class_menu)
          assert 'Себестоимость СМР класс жилья больше не задаёт' in menu
          assert 'flow_prices_custom' in menu
          review=inspect.getsource(main._telegram_send_tep_review)
          assert 'flow_run_calculation' in review and 'web_app' not in review
          print('v0.12.19 smoke checks passed')
          PY
          rm -f scripts/agent_patch.py
          rm -f genplan_endpoints.txt genplan_endpoints_concise.txt genplan_node_probe.txt genplan_calc_core.txt genplan_calc_contexts.txt genplan_calc_target.txt calc_entrypoints.txt calc_requirements.txt
          rm -f .github/trigger-v01219*.txt
          rm -rf __pycache__
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'DevelopAid v0.12.19 Telegram-only preliminary flow'
          git push origin HEAD:${{ github.head_ref }}
