name: Inspect Genplan assets

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: inspect-genplan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  inspect:
    if: github.head_ref == 'agent/developaid-v01219-cadastral-bot-flow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Inspect calculation entrypoints
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('main.py').read_text(encoding='utf-8')
          out=[]
          for pat in [r'class CalcRequest\b', r'def calculate\b', r'@app\.post\("/calculate"', r'def default_inputs\b', r'INPUT_DEFAULT', r'def _telegram_.*summary']:
              for m in re.finditer(pat,s):
                  out.append('\n### '+pat+' @ '+str(m.start())+'\n'+s[max(0,m.start()-1500):min(len(s),m.start()+12000)])
          Path('calc_entrypoints.txt').write_text('\n'.join(out)[:300000],encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add calc_entrypoints.txt
          git commit -m 'Inspect calculation entrypoints' || true
          git push origin HEAD:${{ github.head_ref }}
