name: Apply DevelopAid v0.12.19

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
permissions:
  contents: write
concurrency:
  group: apply-v01219-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  patch:
    if: github.head_ref == 'agent/developaid-v01219-cadastral-bot-flow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Validate runtime
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ -f scripts/agent_patch.py ]; then python scripts/agent_patch.py; fi
          python -m py_compile main.py
          pip -q install -r requirements.txt
          set +e
          python - <<'PY' > /tmp/runtime.log 2>&1
          import inspect
          import main
          assert main.app.version == '0.12.19'
          cad=inspect.getsource(main._telegram_handle_cadastral_numbers)
          assert '_telegram_web_app_url' not in cad
          review=inspect.getsource(main._telegram_send_tep_review)
          assert 'flow_run_calculation' in review and 'web_app' not in review
          raw={'site_area_ha':2.0,'apartments_saleable_sqm':20000,'commercial_saleable_sqm':1000,'parking_spaces':200}
          parsed=main.build_freeform_tep('',raw_values=raw)
          parsed.setdefault('inputs',{}).update({'apartment_price_th':350,'commercial_price_th':350,'parking_price_th':1500,'main_above_th_per_sqm':130,'main_under_th_per_sqm':130})
          x=main._telegram_preliminary_calc_inputs(parsed)
          result=main.calculate(main.CalcRequest(inputs=x,tep=parsed['tep'],rates=[]))
          summary=result.get('summary') or {}
          assert float(summary.get('revenue') or 0)>0
          assert float(summary.get('capex') or 0)>0
          print('RUNTIME_OK', {k:summary.get(k) for k in ('revenue','capex','ebitda','net_profit','irr_equity','llcr')})
          PY
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            cp /tmp/runtime.log v01219_runtime_error.txt
            git add v01219_runtime_error.txt
            git commit -m 'Capture v0.12.19 runtime error' || true
            git push origin HEAD:${{ github.head_ref }} || true
            cat /tmp/runtime.log
            exit "$rc"
          fi
          cat /tmp/runtime.log
          rm -f scripts/agent_patch.py v01219_runtime_error.txt
          rm -f .github/trigger-v01219*.txt
          rm -rf __pycache__
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Finalize v0.12.19 runtime fix'
            git push origin HEAD:${{ github.head_ref }}
          fi
