name: Inspect Genplan assets

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  inspect:
    if: github.head_ref == 'agent/developaid-v01219-cadastral-bot-flow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Inspect local Genplan bundles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          out=[]
          pats=[r'https?://[^"\'`\\\s]+', r'/api/[A-Za-z0-9_./?=&{}:-]+', r'fetch\([^)]{0,300}\)', r'axios[^;]{0,400}', r'cad[_-]?numbers[^;]{0,500}', r'terrArea[^;]{0,500}']
          for p in Path('genplan_assets').glob('*.js'):
              s=p.read_text(encoding='utf-8', errors='ignore')
              hits=[]
              for pat in pats:
                  for m in re.finditer(pat,s,re.I):
                      a=max(0,m.start()-240); b=min(len(s),m.end()+500)
                      hits.append(s[a:b])
              if hits:
                  out.append('\n### '+p.name+'\n')
                  seen=set()
                  for h in hits:
                      h=re.sub(r'\s+',' ',h)
                      if h not in seen:
                          out.append(h+'\n')
                          seen.add(h)
          Path('genplan_endpoints.txt').write_text('\n'.join(out)[:500000], encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add genplan_endpoints.txt
          git commit -m 'Inspect Genplan calculator endpoints' || true
          git push origin HEAD:${{ github.head_ref }}
