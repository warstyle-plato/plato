name: Inspect Genplan assets

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: inspect-genplan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  inspect:
    if: github.head_ref == 'agent/developaid-v01219-cadastral-bot-flow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Inspect local Genplan bundles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          out=[]
          for p in Path('genplan_assets').glob('*.js'):
              s=p.read_text(encoding='utf-8', errors='ignore')
              vals=[]
              vals += re.findall(r'https?://[^"\'`\\\s)]+', s)
              vals += re.findall(r'/(?:api|calc|analysis)[A-Za-z0-9_./?=&{}:\-]*', s, re.I)
              for token in ('glavapu-api','stroimprosto','genplan.tech','cad_numbers','terrArea','Перейти к расчётам'):
                  start=0
                  while True:
                      i=s.find(token,start)
                      if i<0: break
                      vals.append(re.sub(r'\s+',' ',s[max(0,i-180):min(len(s),i+420)]))
                      start=i+len(token)
              if vals:
                  seen=[]
                  for v in vals:
                      if v not in seen: seen.append(v)
                  out.append('### '+p.name)
                  out.extend(seen[:500])
                  out.append('')
          Path('genplan_endpoints_concise.txt').write_text('\n'.join(out)[:250000], encoding='utf-8')

          s=Path('genplan_assets/index-B0jIwkVO.js').read_text(encoding='utf-8',errors='ignore')
          a=s.find('Cf=class')
          b=s.find('_p=e=>', a)
          if a>=0 and b>=0:
              Path('genplan_calc_core.txt').write_text(s[max(0,a-30000):min(len(s),b+30000)],encoding='utf-8')
          else:
              Path('genplan_calc_core.txt').write_text(f'not found a={a} b={b}',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add genplan_endpoints_concise.txt genplan_calc_core.txt
          git commit -m 'Extract Genplan calculator core' || true
          git push origin HEAD:${{ github.head_ref }}
