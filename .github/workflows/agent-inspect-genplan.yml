name: Inspect Genplan assets

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  inspect:
    if: github.head_ref == 'agent/developaid-v01219-cadastral-bot-flow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Inspect local Genplan bundles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          needles=('api','calc','cad','analysis','tep','тэп','territ','stroimprosto','glavapu','genplan','district','quarter','send','request')
          out=[]
          for p in Path('genplan_assets').glob('*.js'):
              s=p.read_text(encoding='utf-8', errors='ignore')
              strings=[]
              for m in re.finditer(r'(["\'`])((?:\\.|(?!\1).){1,500})\1', s):
                  val=m.group(2)
                  low=val.lower()
                  if any(n in low for n in needles):
                      strings.append(val)
              urls=re.findall(r'https?://[^"\'`\\\s)]+',s)
              api_paths=re.findall(r'/(?:api|calc|analysis)[A-Za-z0-9_./?=&{}:\-]*',s,re.I)
              vals=[]
              seen=set()
              for v in strings+urls+api_paths:
                  v=re.sub(r'\\[nrt]',' ',v)
                  if v not in seen:
                      seen.add(v); vals.append(v)
              if vals:
                  out.append('### '+p.name)
                  out.extend(vals[:1000])
                  out.append('')
          Path('genplan_endpoints_concise.txt').write_text('\n'.join(out)[:300000], encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add genplan_endpoints_concise.txt
          git commit -m 'Inspect Genplan endpoint strings' || true
          git push origin HEAD:${{ github.head_ref }}
