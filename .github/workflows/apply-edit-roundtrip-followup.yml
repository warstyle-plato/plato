name: Apply edit roundtrip followup

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/edit-result-roundtrip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply follow-up and validate
        shell: bash
        run: |
          python scripts/fix_edit_roundtrip_followup.py
          python -m py_compile main.py
          python -m pip install -q -r requirements.txt
          python - <<'PY'
          import re
          from pathlib import Path
          import main
          code=Path('main.py').read_text(encoding='utf-8')
          init=code.index('async function initializeTelegramLaunch(){')
          edit=code.index("if(telegramMode==='edit')",init)
          cad=code.index('if(telegramCad){',edit)
          block=code[edit:cad]
          assert 'setupTelegramEditSubmit();' in block
          assert block.index('await calculate();') < block.index('setupTelegramEditSubmit();') < block.index('return;')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',main.PAGE,flags=re.S|re.I)
          Path('/tmp/app.js').write_text(scripts[-1],encoding='utf-8')
          print('FOLLOWUP_OK',main.app.version)
          PY
          node --check /tmp/app.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f scripts/fix_edit_roundtrip_followup.py
          git add -A
          git commit -m 'Show Telegram update action in edit mode'
          git push origin HEAD:${{ github.head_ref }}
