name: Тесты на PR

# Полный набор гонялся только на main — после слияния. Дважды подряд это
# кончалось одинаково: PR сливали, сборка падала на тестах, тег prod оставался
# на позавчерашнем выпуске, и `docker pull prod` честно приносил прошлое. Про
# версию правило уже выведено — «ветку ниже базы заворачивает проверка на PR, до
# слияния, а не красной сборкой после»; здесь то же самое про тесты.
#
# Набор тот же и команда та же, что в build-yandex.yml и что гоняется руками.
# Второй набор был бы вторым мнением о том, готов ли код: расходиться им нельзя.
#
# Сборки образа здесь нет намеренно: PR проверяет код, а образ собирается из
# main. Chromium, реестр и OIDC сюда не едут — это двадцать лишних минут на
# каждый PR ради того, что всё равно будет пересобрано.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    # Правка документации приложение не меняет. Условие то же, что у сборки:
    # там оно появилось не зря. `.github/**` из списка исключений УБРАН —
    # правку самого workflow надо проверять этим же workflow.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  # Пуш в открытый PR отменяет незаконченный прогон прошлого коммита: он
  # проверяет то, чего в ветке уже нет.
  group: tests-on-pr-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Доля ${{ matrix.shard }}
    # Пуш в ветку уже слитого PR всё равно поднимает `synchronize`, и набор
    # уходил на двадцать пять минут ради PR, который слить второй раз нельзя
    # (23.08.2026: коммит лёг на ветку после слияния — четыре прогона впустую).
    # Слитый PR проверять нечего: его код уже в main, и там его проверяет
    # сборка. Работа после слияния начинается с новой ветки от main.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == false
    runs-on: ubuntu-latest
    # Потолок измерен, а не назначен, и мерить его надо заново: набор растёт.
    # Его поднимали 45 → 75 → 120, и дважды он кусал в тот же день, когда его
    # ставили: 08.09 прогон 408 снят на 75:10 при потолке ровно 75. Поднимать
    # дальше — откладывать: 09.09 прогон 440 занял 1:38:43 из 120.
    #
    # Времени при этом нет у отдельных тестов. Двадцать два самых дорогих дают
    # 1053 с — 17,8% прогона, — а остальные 5302 идут по 0,92 с: удешевлять
    # нечего, время И ЕСТЬ набор. Убери все двадцать два (а это сверки книги с
    # движком, их убирать нельзя) — останется 81 минута.
    #
    # Поэтому доли. Ни одна проверка не снята, набор тот же; четыре доли идут
    # порознь и дают около двадцати пяти минут. Потолок на долю поставлен с
    # запасом вдвое и будет перемерен по первому зелёному прогону: пока
    # сама раскладка не измерена, число здесь — рассуждение, а не замер.
    timeout-minutes: 60
    # Одна упавшая доля не снимает остальные: разбирать надо все падения
    # разом, а не по одному за прогон — круг стоит получаса.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      # Команда объявлена в `scripts/run_tests.sh` и больше нигде: её зовут и
      # сборка, и рука. Сокращать набор нельзя — он написан затем, чтобы
      # ловить то, что глазами не видно: гостевые машино-места в выручке
      # книги нашлись именно им.
      #
      # Число долей берётся у самой матрицы (`strategy.job-total`), чтобы
      # оно было объявлено здесь один раз. У сборки оно может быть своим —
      # это не дыра в покрытии: объединение долей равно всему набору при
      # любом их числе, и это держит проверка.
      - name: Доля набора
        env:
          TEST_SHARDS: ${{ strategy.job-total }}
          TEST_SHARD: ${{ matrix.shard }}
        run: bash scripts/run_tests.sh

  # Долей четыре, и «N passed» стало четырьмя строками. Не запустившаяся доля
  # снаружи неотличима от зелёной, поэтому вердикт один и он здесь: красный,
  # пока хоть одна доля не сказала «success».
  verdict:
    name: Полный набор
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Все доли прошли
        run: |
          set -euo pipefail
          result="${{ needs.test.result }}"
          case "$result" in
            success) echo "Все доли прошли." ;;
            skipped) echo "Доли не гонялись: PR уже слит." ;;
            *) echo "Доля набора не прошла: $result" >&2; exit 1 ;;
          esac
