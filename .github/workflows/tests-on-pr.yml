name: Тесты на PR

# Полный набор гонялся только на main — после слияния. Дважды подряд это
# кончалось одинаково: PR сливали, сборка падала на тестах, тег prod оставался
# на позавчерашнем выпуске, и `docker pull prod` честно приносил прошлое. Про
# версию правило уже выведено — «ветку ниже базы заворачивает проверка на PR, до
# слияния, а не красной сборкой после»; здесь то же самое про тесты.
#
# Набор тот же и команда та же, что в build-yandex.yml и что гоняется руками.
# Второй набор был бы вторым мнением о том, готов ли код: расходиться им нельзя.
#
# Сборки образа здесь нет намеренно: PR проверяет код, а образ собирается из
# main. Chromium, реестр и OIDC сюда не едут — это двадцать лишних минут на
# каждый PR ради того, что всё равно будет пересобрано.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    # Правка документации приложение не меняет. Условие то же, что у сборки:
    # там оно появилось не зря. `.github/**` из списка исключений УБРАН —
    # правку самого workflow надо проверять этим же workflow.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  # Пуш в открытый PR отменяет незаконченный прогон прошлого коммита: он
  # проверяет то, чего в ветке уже нет.
  group: tests-on-pr-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Доля ${{ matrix.shard }}
    # Пуш в ветку уже слитого PR всё равно поднимает `synchronize`, и набор
    # уходил на двадцать пять минут ради PR, который слить второй раз нельзя
    # (23.08.2026: коммит лёг на ветку после слияния — четыре прогона впустую).
    # Слитый PR проверять нечего: его код уже в main, и там его проверяет
    # сборка. Работа после слияния начинается с новой ветки от main.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == false
    runs-on: ubuntu-latest
    # Это бюджет ВСЕЙ доли, включая установку и завершение, а не срок теста.
    # Старые 80 минут давали 2× к замеру 39 минут от 09.09.2026. Набор вырос:
    # 18.11.2026 в прогоне 44288442214 доля 4 успешно заняла около 74 минут,
    # а доля 2 дошла до 95% и была снята общим потолком 80 минут без
    # наблюдённых падений тестов; остальные пять долей прошли.
    # 80 минут — нижняя граница длительности отменённой доли, а не замер
    # успешного завершения. Ограниченный запас к этому наблюдению: 2×80=160.
    # Набор и шесть долей прежние; срок одного теста остаётся 600 секунд
    # в scripts/run_tests.sh. Равенство бюджетов PR/main держит
    # `test_the_tests_run_before_the_merge`.
    timeout-minutes: 160
    # Одна упавшая доля не снимает остальные: разбирать надо все падения
    # разом, а не по одному за прогон — круг стоит получаса.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      # Браузер ставится ОТДЕЛЬНЫМ шагом, потому что пакет playwright и сам
      # браузер — разные вещи: пакет приезжает из requirements, браузера в нём
      # нет. Пока этого шага не было, двадцать две проверки, которые решает
      # настоящий Chromium, на CI не шли НИ РАЗУ — они честно писали `skip`, а
      # снаружи «прошло» и «не запускалось» выглядят одинаково. Две худшие
      # поломки конца августа были именно браузерными (рекурсия в `cloneValue`,
      # `ReferenceError` на `tepAutoTimer`), и зелёный CI о них молчал.
      #
      # `REQUIRE_BROWSER` стоит здесь же, рядом с установкой: раз браузер
      # поставлен, его отсутствие значит, что установка сломалась, — и это
      # обязано краснеть, а не пропускаться. Иначе сломавшаяся установка
      # молча вернёт набор туда, откуда пришли.
      - name: Браузер для проверок страницы
        run: python -m playwright install --with-deps chromium
      # Команда объявлена в `scripts/run_tests.sh` и больше нигде: её зовут и
      # сборка, и рука. Сокращать набор нельзя — он написан затем, чтобы
      # ловить то, что глазами не видно: гостевые машино-места в выручке
      # книги нашлись именно им.
      #
      # Число долей берётся у самой матрицы (`strategy.job-total`), чтобы
      # оно было объявлено здесь один раз. У сборки оно может быть своим —
      # это не дыра в покрытии: объединение долей равно всему набору при
      # любом их числе, и это держит проверка.
      - name: Доля набора
        env:
          TEST_SHARDS: ${{ strategy.job-total }}
          TEST_SHARD: ${{ matrix.shard }}
          REQUIRE_BROWSER: "1"
        run: bash scripts/run_tests.sh
      - name: Публичные учебные снимки компактного ГПР
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gpr-synthetic-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: .ci-ui-review/gpr-synthetic/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3

  # Долей шесть, и «N passed» стало шестью строками. Не запустившаяся доля
  # снаружи неотличима от зелёной, поэтому вердикт один и он здесь: красный,
  # пока хоть одна доля не сказала «success».
  verdict:
    name: Полный набор
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Все доли прошли
        run: |
          set -euo pipefail
          result="${{ needs.test.result }}"
          case "$result" in
            success) echo "Все доли прошли." ;;
            skipped) echo "Доли не гонялись: PR уже слит." ;;
            *) echo "Доля набора не прошла: $result" >&2; exit 1 ;;
          esac
