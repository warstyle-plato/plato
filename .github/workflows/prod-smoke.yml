name: Закрытое чтение сохранённых финансовых источников и КРТ
run-name: cached-source-capture-encrypted
on:
  workflow_dispatch:
    inputs:
      expected_runtime_commit:
        description: Exact deployed support runtime verified separately after full CI and release
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: contracts-source-diagnostic
  cancel-in-progress: false
jobs:
  capture:
    name: Сохранить исходники в шифрованный артефакт без записи в продукт
    if: >-
      github.repository == 'warstyle-plato/plato' &&
      github.ref == 'refs/heads/ops/financial-view-root' &&
      github.actor == 'warstyle-plato' &&
      github.triggering_actor == 'warstyle-plato' &&
      github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Создать одноразовый публичный сертификат ввода
        env:
          EXPECTED_RUNTIME_COMMIT: ${{ inputs.expected_runtime_commit }}
        run: python3 .github/diagnostics/cached-source-capture.py prepare
      - name: Публичный сертификат текущего запуска
        uses: actions/upload-artifact@v7
        with:
          name: cached-source-input-public
          path: |
            ${{ runner.temp }}/source-session-${{ github.run_id }}-1/public.pem
            ${{ runner.temp }}/source-session-${{ github.run_id }}-1/public.json
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Получить только сохранённые источники
        id: capture
        env:
          EXPECTED_RUNTIME_COMMIT: ${{ inputs.expected_runtime_commit }}
          GITHUB_TOKEN: ${{ github.token }}
          CAPTURE_ADMIN_KEY: ${{ secrets.DEVELOPAID_ADMIN_KEY }}
        run: python3 .github/diagnostics/cached-source-capture.py capture
      - name: Зашифрованные источники и свидетельство чтения
        if: success() && steps.capture.outputs.proof_created == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: cached-source-audit-encrypted
          path: ${{ runner.temp }}/source-audit-cipher/*.cms
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Удалить одноразовые транспортные данные
        if: always()
        run: |
          python3 - <<'PY'
          import os, shutil
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          for path in (root / ('source-session-' + os.environ['GITHUB_RUN_ID'] + '-1'), root / 'source-audit-cipher'):
              if path.is_symlink():
                  path.unlink()
              elif path.is_dir():
                  shutil.rmtree(path)
          PY
