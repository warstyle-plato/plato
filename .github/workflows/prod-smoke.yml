name: Одноразовое утверждение согласованного ГПР и РНВ
run-name: approved-gpr-source-apply-once

# Explicit approval on this ops branch; main keeps its ordinary prod smoke.
on:
  workflow_dispatch:
    inputs:
      expected_runtime_commit:
        description: Exact 40-character runtime commit after the separately verified release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: approved-gpr-source-apply-once
  cancel-in-progress: false

jobs:
  apply:
    name: Явно утвердить согласованный ГПР и дату РНВ
    if: >-
      github.repository == 'warstyle-plato/plato' &&
      github.ref == 'refs/heads/ops/approve-corpus-gpr-once' &&
      github.actor == 'warstyle-plato' &&
      github.triggering_actor == 'warstyle-plato' &&
      github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Проверить границы и применить проверенную версию
        id: apply
        env:
          EXPECTED_RUNTIME_COMMIT: ${{ inputs.expected_runtime_commit }}
          GPR_ONCE_TRANSPORT_KEY: ${{ secrets.PLATO_GPR_APPROVAL_ONCE_KEY }}
          APPLY_ADMIN_KEY: ${{ secrets.DEVELOPAID_ADMIN_KEY }}
        run: python3 .github/diagnostics/apply-approved-gpr.py
      - name: Зашифрованное свидетельство результата
        if: always() && steps.apply.outputs.proof_created == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: approved-gpr-apply-encrypted
          path: ${{ runner.temp }}/approved-gpr-apply-proof.cms
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Удалить временные транспортные данные
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import shutil
          root = Path(os.environ['RUNNER_TEMP'])
          for prefix in ('gpr-input-', 'gpr-proof-'):
              for path in root.glob(prefix+'*'):
                  if path.is_symlink():
                      path.unlink()
                  elif path.is_dir():
                      shutil.rmtree(path)
          (root/'approved-gpr-apply-proof.cms').unlink(missing_ok=True)
          PY
