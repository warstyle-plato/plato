name: Проверка прода после выката

# Тест PR проверяет код, а не то, что видит пользователь: тизер КРТ Нагатино
# рисовал 10 участков из 20, из выгрузки торгов пропали примечания, а CI был
# зелёный. Здесь готовые поверхности живого прода проверяются на эталонном
# проекте (scripts/prod_smoke_reference.json) сразу после выката.
#
# Только чтение и по одному запросу на поверхность: проекты пользователей не
# трогаются, нагрузка — один эталонный проект.

on:
  workflow_run:
    workflows: ["Сборка образа в Yandex Container Registry"]
    types: [completed]
  workflow_dispatch:
    inputs:
      base:
        description: Адрес прода
        default: https://developaid.ru
      expect_commit:
        description: Коммит, который должен отдавать /health (пусто — не ждать)
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: prod-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Поверхности прода
    # Упавшая сборка ничего не выкатила — проверять нечего.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE: ${{ github.event.inputs.base || 'https://developaid.ru' }}
      EXPECT_COMMIT: ${{ github.event.workflow_run.head_sha || github.event.inputs.expect_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 50

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pypdf playwright

      - name: Браузер для страницы «Итог»
        run: python -m playwright install --with-deps chromium

      - name: Последний слитый PR
        id: pr
        run: |
          # Номер из заголовка merge/squash-коммита: «… (#541)».
          last=$(git log -1 --format=%s | grep -oE '#[0-9]+' | tail -1 || true)
          echo "last_pr=${last:-не определён} ($(git log -1 --format=%h))" >> "$GITHUB_OUTPUT"

      - name: Проверка прода
        id: smoke
        env:
          LAST_PR: ${{ steps.pr.outputs.last_pr }}
          # Тизер и экономика «Итога» — за входом; без ключа они пропускаются
          # с этой причиной в итоге, а не зеленеют.
          PROD_SMOKE_ADMIN_KEY: ${{ secrets.DEVELOPAID_ADMIN_KEY }}
        run: |
          args=(--base "$BASE" --summary smoke-summary.md --json smoke-result.json
                --out smoke-out --last-pr "$LAST_PR")
          if [ -n "$EXPECT_COMMIT" ]; then
            # Не проверять старый образ: ждём, пока прод отдаст этот коммит
            # (а если /health commit пуст — версию из этого же коммита).
            version=$(grep -m1 '^VERSION = ' main_legacy.py | cut -d'"' -f2)
            args+=(--wait-commit "$EXPECT_COMMIT" --wait-version "$version" --wait-timeout 2400)
          fi
          set +e
          python3 scripts/prod_smoke.py "${args[@]}"
          code=$?
          set -e
          cat smoke-summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Результат прогона
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-smoke
          path: |
            smoke-summary.md
            smoke-result.json
            smoke-out/
          if-no-files-found: ignore

      - name: Issue prod-regression
        if: failure() && steps.smoke.outputs.code != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.existsSync('smoke-summary.md')
              ? fs.readFileSync('smoke-summary.md', 'utf8')
              : 'Итог прогона не записан — смотрите журнал.';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const label = 'prod-regression';
            try {
              await github.rest.issues.getLabel({...context.repo, name: label});
            } catch (e) {
              await github.rest.issues.createLabel({...context.repo, name: label, color: 'b60205',
                description: 'Проверка прода после выката нашла поломку'});
            }
            const open = await github.rest.issues.listForRepo({...context.repo, state: 'open', labels: label, per_page: 1});
            if (open.data.length) {
              // Открытая уже есть — дописываем прогон туда, новую не плодим.
              await github.rest.issues.createComment({...context.repo, issue_number: open.data[0].number,
                body: `Снова красно: ${run}\n\n${body}`});
              return;
            }
            await github.rest.issues.create({...context.repo, title: 'Прод: проверка поверхностей после выката красная',
              labels: [label], body: `Прогон: ${run}\n\n${body}`});
