name: Диагностика договоров и исходных объёмов
run-name: contracts-source-private-check

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact deployed runtime commit, verified before authorization
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: contracts-source-diagnostic
  cancel-in-progress: false

jobs:
  probe:
    name: Проверить наличие данных без публикации содержимого
    runs-on: ubuntu-latest
    timeout-minutes: 8
    if: github.actor == 'warstyle-plato'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Проверка защищённых данных
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          PROBE_ADMIN_KEY: ${{ secrets.DEVELOPAID_ADMIN_KEY }}
        run: |
          python3 - <<'PY'
          import datetime
          import hashlib
          import json
          import math
          import os
          import re
          import signal
          import subprocess
          from pathlib import Path
          import sys
          import time
          import urllib.error
          import urllib.request

          BASE = 'https://developaid.ru'
          MAX_BYTES = 16 * 1024 * 1024
          FINANCIAL_RUNTIME = '2061d1a01d7607eb44113bc2cc429abfaf4814de'
          FINANCIAL_CUT = '2026-11-09'
          FINANCIAL_RSS_DATE = '2026-11-05'
          TOTAL_SECONDS = 360
          HTTP_SECONDS = 15
          POLL_SECONDS = 2
          POST_PATHS = frozenset({
              '/monitor/report/projects', '/monitor/contracts/build',
              '/monitor/contracts/result', '/monitor/gpr-corpus/view',
              '/monitor/schedule-gpr-physical/view', '/monitor/view',
          })
          REASONS = frozenset({
              'invalid_expected_commit', 'deadline', 'redirect_denied', 'http_auth',
              'http_capacity', 'http_failure', 'transport_failure', 'response_too_large',
              'invalid_json', 'invalid_payload', 'runtime_mismatch', 'missing_secret',
              'project_selection_unverified', 'invalid_ticket', 'ticket_changed',
              'job_rejected', 'contracts_missing', 'report_missing', 'unexpected_error',
              'financial_source_changed',
          })
          FLAG_NAMES = (
              'contracts_present', 'any_contract_price', 'all_contract_prices',
              'any_dated_money', 'all_dated_money',
              'any_reference_money', 'all_rows_have_dated_or_reference_money',
              'ratio_present', 'all_ratios', 'any_rss_financial_source',
              'rss_snapshot_present', 'rss_read_failed',
              'any_physical_positions', 'references_safety_metadata_complete',
          )


          class ProbeError(Exception):
              def __init__(self, code):
                  self.code = code if code in REASONS else 'unexpected_error'
                  super().__init__(self.code)


          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise ProbeError('redirect_denied')


          def records_or_ids(value, allowed=None):
              if (not isinstance(value, list)
                      or any(not isinstance(x, str) or re.fullmatch(r'[0-9a-f]{64}', x) is None for x in value)
                      or len(set(value)) != len(value)
                      or (allowed is not None and not set(value) <= allowed)):
                  raise ProbeError('invalid_payload')
              return value


          def mapping(value):
              if value is None:
                  return {}
              if not isinstance(value, dict):
                  raise ProbeError('invalid_payload')
              return value


          def records(value):
              if value is None:
                  return []
              if not isinstance(value, list) or any(not isinstance(x, dict) for x in value):
                  raise ProbeError('invalid_payload')
              return value


          def number(value):
              if not isinstance(value, (int, float)) or isinstance(value, bool):
                  return False
              try:
                  return math.isfinite(value)
              except (OverflowError, ValueError):
                  return False


          def fingerprint(value):
              # Canonical finite JSON stays in RAM. No source values/hashes in stdout.
              try:
                  raw = json.dumps(value, ensure_ascii=False, sort_keys=True,
                                   allow_nan=False).encode('utf-8')
              except (TypeError, ValueError):
                  raise ProbeError('invalid_payload') from None
              return hashlib.sha256(raw).digest()


          def financial_projection(payload, register):
              snapshot = mapping(payload.get('snapshot'))
              source = mapping(snapshot.get('source'))
              dashboard = mapping(snapshot.get('dashboard'))
              funding = mapping(dashboard.get('funding'))
              dates = mapping(funding.get('source_dates'))
              rss = mapping(dates.get('rss'))
              if (snapshot.get('cut') != FINANCIAL_CUT
                      or source.get('estimate') != FINANCIAL_RSS_DATE
                      or mapping(register.get('snapshots')).get('rss') != FINANCIAL_RSS_DATE
                      or dates.get('report_date') != FINANCIAL_CUT
                      or rss.get('data_date') != FINANCIAL_RSS_DATE
                      or type(funding.get('known')) is not bool):
                  raise ProbeError('runtime_mismatch')
              for kind in ('budget', 'rss', 'schedule'):
                  item = mapping(dates.get(kind))
                  day = item.get('data_date')
                  if day is not None:
                      try:
                          valid = isinstance(day, str) and datetime.date.fromisoformat(day).isoformat() == day
                      except ValueError:
                          valid = False
                      if not valid:
                          raise ProbeError('invalid_payload')
              if funding.get('own_money') is not None and not isinstance(funding['own_money'], dict):
                  raise ProbeError('invalid_payload')
              for node, fields in ((snapshot, ('money', 'payments')),
                                   (dashboard, ('construction', 'funding', 'sources'))):
                  if any(not isinstance(node.get(field), dict) or not node[field] for field in fields):
                      raise ProbeError('invalid_payload')
              if ('payment_fact' not in snapshot['money']
                      or not {'approved', 'limit'} <= dashboard['construction'].keys()):
                  raise ProbeError('invalid_payload')
              own = mapping(funding.get('own_money'))
              if funding.get('own_money') is not None and not {'budget', 'paid', 'limit', 'left', 'need', 'rows'} <= own.keys():
                  raise ProbeError('invalid_payload')
              for field in ('budget', 'paid', 'limit', 'left', 'need'):
                  if own.get(field) is not None and not number(own[field]):
                      raise ProbeError('invalid_payload')
              records(own.get('rows'))
              # Capture the existing financial answers, including own_money components
              # and payment qualifications. No recomputation or new allocation is applied.
              result = {'cut': snapshot['cut'], 'source': source,
                        'money': mapping(snapshot.get('money')),
                        'payments': mapping(snapshot.get('payments')),
                        'dashboard': {'construction': mapping(dashboard.get('construction')),
                                      'funding': funding,
                                      'sources': mapping(dashboard.get('sources'))}}
              fingerprint(result)
              return result


          class Probe:
              def __init__(self, expected, *, opener=None, clock=time.monotonic, sleep=time.sleep):
                  if expected != FINANCIAL_RUNTIME:
                      raise ProbeError('invalid_expected_commit')
                  self.expected = expected
                  self._financial_project = None
                  self.opener = opener or urllib.request.build_opener(NoRedirect())
                  self.clock, self.sleep = clock, sleep
                  self.deadline = clock() + TOTAL_SECONDS

              def remaining(self):
                  remaining = self.deadline - self.clock()
                  if remaining <= 0:
                      raise ProbeError('deadline')
                  return remaining

              def request(self, path, body=None):
                  if (body is None and path != '/health') or (body is not None and path not in POST_PATHS):
                      raise ProbeError('invalid_payload')
                  headers = {'Cache-Control': 'no-cache', 'User-Agent': 'PLATO-Monitor-Data-Probe/1'}
                  raw = None
                  if body is not None:
                      if not isinstance(body, dict):
                          raise ProbeError('invalid_payload')
                      if path == '/monitor/view' and (set(body) != {'project', 'cut', 'key'}
                              or not self._financial_project
                              or body.get('project') != self._financial_project
                              or body.get('cut') != FINANCIAL_CUT
                              or not isinstance(body.get('key'), str) or not body['key'].strip()
                              or len(body['key']) > 4096):
                          raise ProbeError('invalid_payload')
                      raw = json.dumps(body, ensure_ascii=False, allow_nan=False).encode('utf-8')
                      headers['Content-Type'] = 'application/json'
                  request = urllib.request.Request(BASE + path, data=raw, headers=headers,
                                                   method='POST' if body is not None else 'GET')
                  try:
                      with self.opener.open(request, timeout=min(HTTP_SECONDS, self.remaining())) as response:
                          if response.geturl() != BASE + path:
                              raise ProbeError('redirect_denied')
                          if response.status not in (200, 202):
                              raise ProbeError('http_failure')
                          chunks, size = [], 0
                          # read1 avoids waiting for an entire 64KiB buffer on a slow stream.
                          while True:
                              self.remaining()
                              chunk = response.read1(min(65536, MAX_BYTES - size + 1))
                              self.remaining()
                              if not chunk:
                                  break
                              size += len(chunk)
                              if size > MAX_BYTES:
                                  raise ProbeError('response_too_large')
                              chunks.append(chunk)
                          payload = b''.join(chunks)
                      self.remaining()
                  except urllib.error.HTTPError as exc:
                      if exc.code in (301, 302, 303, 307, 308):
                          raise ProbeError('redirect_denied') from None
                      if exc.code in (401, 403):
                          raise ProbeError('http_auth') from None
                      if exc.code == 429:
                          raise ProbeError('http_capacity') from None
                      raise ProbeError('http_failure') from None
                  except (urllib.error.URLError, OSError, TimeoutError):
                      raise ProbeError('transport_failure') from None
                  try:
                      result = json.loads(payload)
                  except (ValueError, UnicodeError):
                      raise ProbeError('invalid_json') from None
                  if not isinstance(result, dict):
                      raise ProbeError('invalid_payload')
                  return result

              def health(self):
                  payload = self.request('/health')
                  version = payload.get('version')
                  if (payload.get('status') != 'ok' or payload.get('commit') != self.expected
                          or not isinstance(version, str)
                          or not re.fullmatch(r'[0-9]{1,6}\.[0-9]{1,6}\.[0-9]{1,6}', version)):
                      raise ProbeError('runtime_mismatch')
                  return version

              def job(self, build_path, result_path, body, key):
                  # Exactly one admission; no blind retries or business mutations.
                  payload = self.request(build_path, {**body, 'key': key})
                  ticket = None
                  while True:
                      if payload.get('ok') is False:
                          raise ProbeError('job_rejected')
                      pending = payload.get('pending')
                      current = payload.get('ticket')
                      if (type(pending) is not bool or not isinstance(current, str)
                              or not re.fullmatch('[0-9a-f]{32}', current)):
                          raise ProbeError('invalid_ticket')
                      if ticket is not None and current != ticket:
                          raise ProbeError('ticket_changed')
                      ticket = current
                      if not pending:
                          return payload
                      self.remaining()
                      self.sleep(min(POLL_SECONDS, self.remaining()))
                      self.remaining()
                      payload = self.request(result_path, {'key': key, 'ticket': ticket})

              def run(self, key_getter):
                  first_version = self.health()
                  # The key is not even read until the exact public runtime gate succeeds.
                  key = key_getter()
                  if not isinstance(key, str) or not key.strip() or len(key) > 4096:
                      raise ProbeError('missing_secret')
                  key = key.strip()
                  projects = self.request('/monitor/report/projects', {'key': key})
                  options = records(projects.get('projects'))
                  eligible = []
                  for option in options:
                      kinds = option.get('data')
                      if not isinstance(kinds, list) or any(not isinstance(k, str) for k in kinds):
                          raise ProbeError('invalid_payload')
                      if 'cumulative' in kinds:
                          eligible.append(option)
                  if len(eligible) != 1:
                      raise ProbeError('project_selection_unverified')
                  project = eligible[0].get('project')
                  if not isinstance(project, str) or not project.strip() or len(project) > 200:
                      raise ProbeError('project_selection_unverified')
                  self._financial_project = project
                  day = FINANCIAL_CUT
                  result = self.job('/monitor/contracts/build', '/monitor/contracts/result',
                                    {'project': project, 'cut': day}, key)
                  register = result.get('register')
                  if not isinstance(register, dict) or 'rows' not in register:
                      raise ProbeError('contracts_missing')
                  financial_view = self.request('/monitor/view',
                      {'project': project, 'cut': day, 'key': key})
                  financial = financial_projection(financial_view, register)
                  financial_fingerprint = fingerprint(financial)
                  del financial_view
                  rows = records(register['rows'])
                  all_refs = [ref for row in rows for ref in records(row.get('reported_performance_sources'))]
                  rss_snapshot = mapping(register.get('snapshots')).get('rss')
                  try:
                      rss_snapshot_present = (isinstance(rss_snapshot, str)
                          and datetime.date.fromisoformat(rss_snapshot).isoformat() == rss_snapshot)
                  except ValueError:
                      rss_snapshot_present = False
                  source_warnings = register.get('warnings')
                  if source_warnings is None:
                      source_warnings = []
                  if (not isinstance(source_warnings, list)
                          or any(not isinstance(warning, str) for warning in source_warnings)):
                      raise ProbeError('invalid_payload')

                  def reference(row):
                      return any(number(ref.get('completed'))
                                 and ref.get('future_periods_excluded') is not True
                                 for ref in records(row.get('reported_performance_sources')))

                  flags = {
                      'contracts_present': bool(rows),
                      'any_contract_price': any(number(row.get('amount')) for row in rows),
                      'all_contract_prices': bool(rows) and all(number(row.get('amount')) for row in rows),
                      'any_dated_money': any(number(row.get('completed')) for row in rows),
                      'all_dated_money': bool(rows) and all(number(row.get('completed')) for row in rows),
                      'any_reference_money': any(reference(row) for row in rows),
                      'all_rows_have_dated_or_reference_money': bool(rows) and all(
                          number(row.get('completed')) or reference(row) for row in rows),
                      'ratio_present': any(number(row.get('completion_ratio')) for row in rows),
                      'all_ratios': bool(rows) and all(number(row.get('completion_ratio')) for row in rows),
                      'any_rss_financial_source': any(
                          isinstance(source.get('label'), str) and source['label'].startswith('РСС')
                          for row in rows for source in records(row.get('financial_sources'))),
                      'rss_snapshot_present': rss_snapshot_present,
                      'rss_read_failed': any(warning in (
                          'Реестр договоров в выбранном снимке РСС не прочитан.',
                          'Строки реестра договоров РСС неоднозначны; денежные значения не объединены.',
                      ) for warning in source_warnings),
                      'any_physical_positions': any(bool(records(row.get('physical_items'))) for row in rows),
                      'references_safety_metadata_complete': bool(all_refs) and all(
                          type(ref.get('future_periods_excluded')) is bool
                          and type(ref.get('period_dates_known')) is bool for ref in all_refs),
                  }
                  # Counts and booleans only. No private names, IDs, source paths,
                  # percentages, monetary values, request bodies or artifacts leave memory.
                  row_ids = records_or_ids([r.get('id') for r in rows])
                  allowed = set(row_ids)
                  pending_raw = records(register.get('unmatched_works'))
                  evidence, signatures, pending_by_id = {}, {}, {}

                  def add_evidence(item):
                      identity = item.get('id')
                      records_or_ids([identity])
                      status = item.get('match_status')
                      if status not in {'confirmed', 'ambiguous', 'proposed', 'unmatched'}:
                          raise ProbeError('invalid_payload')
                      choices = records_or_ids(item.get('selectable_contract_ids'), allowed)
                      reason = item.get('match_reason') or ''
                      if not isinstance(reason, str):
                          raise ProbeError('invalid_payload')
                      signature = (status, tuple(sorted(choices)), reason)
                      if identity in signatures and signatures[identity] != signature:
                          raise ProbeError('invalid_payload')
                      signatures[identity] = signature
                      evidence[identity] = item

                  for row in rows:
                      for item in records(mapping(row.get('reconciliation')).get('daily_evidence')):
                          add_evidence(item)
                  for item in pending_raw:
                      add_evidence(item)
                      if item['match_status'] == 'confirmed':
                          raise ProbeError('invalid_payload')
                      pending_by_id[item['id']] = item
                  pending = list(pending_by_id.values())
                  reason_prefixes = {
                      'party_uncertain': 'Подрядчик в сообщении указан неоднозначно.',
                      'party_missing': 'В сообщении не указан подрядчик.',
                      'party_not_matched': 'Договор этого подрядчика в накопительных не найден.',
                      'contract_after_message': 'Договоры подрядчика заключены после сообщения.',
                      'scope_conflict': 'Корпусный состав сообщения не подтверждён',
                      'multiple_numbers': 'В записи указано несколько номеров договоров.',
                      'number_conflict': 'Указанный номер не совпадает',
                      'multiple_contracts': 'У подрядчика несколько договоров.',
                      'manual_review': 'Прежняя ручная связь требует проверки:',
                      'single_suggestion': 'Проверьте предложенный договор и подтвердите связь.',
                  }
                  counts = {
                      'contracts': len(rows),
                      'unresolved_headers': len(records(register.get('unresolved_sources'))),
                      'statement_sources': len(all_refs),
                      'physical_positions': sum(len(records(r.get('physical_items'))) for r in rows),
                      'physical_dated_percent_known': sum(number(i.get('completion_ratio'))
                          for r in rows for i in records(r.get('physical_items'))),
                      'physical_reference_percent_known': sum(number(i.get('reported_completion_ratio'))
                          for r in rows for i in records(r.get('physical_items'))),
                      'rows_with_all_position_percentages': sum(
                          bool(records(r.get('physical_items'))) and all(
                              number(i.get('completion_ratio')) or (
                                  i.get('future_periods_excluded') is False
                                  and number(i.get('reported_completion_ratio')))
                              for i in records(r.get('physical_items'))) for r in rows),
                      'rows_with_primary_progress': sum(number(mapping(r.get('progress')).get('ratio')) for r in rows),
                      'rss_matched': sum(mapping(r.get('rss_match')).get('status') == 'matched' for r in rows),
                      'unmatched_records': len(pending),
                      'pending_zero_choices': sum(not records_or_ids(i.get('selectable_contract_ids'), allowed) for i in pending),
                      'pending_one_choice': sum(len(records_or_ids(i.get('selectable_contract_ids'), allowed)) == 1 for i in pending),
                      'pending_multiple_choices': sum(len(records_or_ids(i.get('selectable_contract_ids'), allowed)) > 1 for i in pending),
                  }
                  for status in ('confirmed', 'ambiguous', 'proposed', 'unmatched'):
                      counts['evidence_' + status] = sum(i.get('match_status') == status for i in evidence.values())
                  for name, prefix in reason_prefixes.items():
                      counts['pending_reason_' + name] = sum(
                          str(i.get('match_reason') or '').startswith(prefix) for i in pending)
                  counts['pending_reason_other'] = sum(
                      not any(str(i.get('match_reason') or '').startswith(prefix)
                              for prefix in reason_prefixes.values()) for i in pending)
                  if any(type(v) is not int or v < 0 or v > 1000000 for v in counts.values()):
                      raise ProbeError('invalid_payload')
                  if self.health() != first_version:
                      raise ProbeError('runtime_mismatch')
                  gpr_source = self.request('/monitor/gpr-corpus/view',
                      {'project': project, 'cut': day, 'key': key})
                  physical = self.request('/monitor/schedule-gpr-physical/view',
                      {'project': project, 'cut': day, 'offset': 0, 'key': key})
                  item_count = physical.get('item_count')
                  if type(item_count) is not int or item_count < 0 or item_count > 2000:
                      raise ProbeError('invalid_payload')
                  if physical.get('snapshot_id') != mapping(register.get('snapshots')).get('cumulative_id'):
                      raise ProbeError('runtime_mismatch')
                  physical_items, item_ids = [], set()

                  def accept_page(page, offset):
                      if (page.get('offset') != offset
                              or any(page.get(field) != physical.get(field) for field in
                                     ('snapshot_id', 'source_sha256', 'revision', 'item_count'))):
                          raise ProbeError('runtime_mismatch')
                      items = records(page.get('items'))
                      if len(items) != min(200, max(0, item_count-offset)):
                          raise ProbeError('invalid_payload')
                      for item in items:
                          identity = item.get('item_id')
                          if (not isinstance(identity, str) or re.fullmatch(r'\d{1,5}:\d{1,6}', identity) is None
                                  or identity in item_ids):
                              raise ProbeError('invalid_payload')
                          item_ids.add(identity)
                      physical_items.extend(items)

                  accept_page(physical, 0)
                  for offset in range(200, item_count, 200):
                      page = self.request('/monitor/schedule-gpr-physical/view',
                          {'project': project, 'cut': day, 'offset': offset, 'key': key})
                      accept_page(page, offset)
                  if len(physical_items) != item_count:
                      raise ProbeError('invalid_payload')
                  physical['items'] = physical_items
                  gpr_end = self.request('/monitor/gpr-corpus/view',
                      {'project': project, 'cut': day, 'key': key})
                  financial_end = financial_projection(self.request('/monitor/view',
                      {'project': project, 'cut': day, 'key': key}), register)
                  if fingerprint(financial_end) != financial_fingerprint:
                      raise ProbeError('financial_source_changed')
                  del financial_end, financial_fingerprint
                  if any(mapping(gpr_end.get('source')).get(field) != mapping(gpr_source.get('source')).get(field)
                         for field in ('sha256', 'taken_at')) or self.health() != first_version:
                      raise ProbeError('runtime_mismatch')
                  # Only ciphertext is published. The fixed public recipient is
                  # reviewed with this source; its private key stays in the control workspace.
                  private_payload = json.dumps({'runtime_commit': self.expected,
                      'run_id': os.environ.get('GITHUB_RUN_ID', ''),
                      'project': project, 'register': register, 'gpr_source': gpr_source,
                      'physical': physical, 'financial_view': financial}, ensure_ascii=False,
                      allow_nan=False).encode('utf-8')
                  target = Path(os.environ['RUNNER_TEMP']) / 'contracts-audit.cms'
                  with target.open('wb') as encrypted:
                      os.chmod(target, 0o600)
                      result = subprocess.run(['openssl', 'cms', '-encrypt', '-aes-256-gcm',
                          '-binary', '-outform', 'DER', '-recip',
                          '.github/diagnostics/contract-audit-recipient.pem',
                          '-keyopt', 'rsa_padding_mode:oaep', '-keyopt', 'rsa_oaep_md:sha256'],
                          input=private_payload, stdout=encrypted,
                          stderr=subprocess.DEVNULL, check=False, timeout=30,
                          env={'PATH': os.environ.get('PATH', '/usr/bin:/bin')})
                  if result.returncode != 0 or not target.is_file() or target.stat().st_size == 0:
                      target.unlink(missing_ok=True)
                      raise ProbeError('unexpected_error')
                  del private_payload
                  if set(flags) != set(FLAG_NAMES) or any(type(value) is not bool for value in flags.values()):
                      raise ProbeError('invalid_payload')
                  funding = financial['dashboard']['funding']
                  own = funding.get('own_money')
                  financial_counts = {
                      'financial_view_present': True, 'financial_sources_stable': True,
                      'financial_funding_known': funding['known'],
                      'financial_own_money_present': isinstance(own, dict),
                      'financial_component_rows': len(records(mapping(own).get('rows'))),
                      **{'financial_' + field + '_known': number(mapping(own).get(field))
                         for field in ('budget', 'paid', 'limit', 'left', 'need')},
                  }
                  return {'status': 'ok', 'runtime_version': first_version,
                          'runtime_commit': self.expected, **flags, **counts, **financial_counts}


          def main():
              started = time.monotonic()

              def expired(signum, frame):
                  raise ProbeError('deadline')

              # Linux runner: the alarm also bounds slow streaming/JSON parsing, not just polling.
              signal.signal(signal.SIGALRM, expired)
              signal.alarm(TOTAL_SECONDS)
              try:
                  probe = Probe(os.environ.get('EXPECTED_COMMIT', ''))
                  result = probe.run(lambda: os.environ.get('PROBE_ADMIN_KEY', ''))
                  code = 0
              except ProbeError as exc:
                  result = {'status': 'error', 'error_type': 'ProbeError', 'reason_code': exc.code}
                  code = 1
              except Exception:
                  # Never print server bodies, request values, private identifiers, or exception text.
                  result = {'status': 'error', 'error_type': 'UnexpectedError', 'reason_code': 'unexpected_error'}
                  code = 1
              finally:
                  signal.alarm(0)
              result['seconds'] = round(max(0, time.monotonic() - started), 3)
