name: Диагностика загрузки сводки

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnose-management-report
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Проверить ответ сводки без публикации содержимого
        env:
          ADMIN_KEY: ${{ secrets.DEVELOPAID_ADMIN_KEY }}
        run: |
          python3 - <<'PY'
          import datetime, json, os, sys, time, urllib.error, urllib.request

          # No checkout, inputs, artifacts, response bodies or client names in logs.
          # The secret is sent only to the fixed production origin, without redirects.
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect)
          base = 'https://developaid.ru'
          key = os.environ.get('ADMIN_KEY', '')
          if not key:
              print(json.dumps({'probe': 'configuration', 'error': 'admin_secret_unavailable'}))
              raise SystemExit(2)

          def call(path, payload=None):
              started = time.monotonic()
              data = None if payload is None else json.dumps(dict(payload, key=key)).encode()
              request = urllib.request.Request(base + path, data=data,
                  headers={'Content-Type': 'application/json'} if data else {})
              try:
                  with opener.open(request, timeout=15) as response:
                      raw = response.read()
                      result = json.loads(raw)
                      print(json.dumps({'probe': path, 'status': response.status,
                          'seconds': round(time.monotonic() - started, 3), 'bytes': len(raw)}))
                      return result
              except urllib.error.HTTPError as exc:
                  print(json.dumps({'probe': path, 'status': exc.code,
                      'seconds': round(time.monotonic() - started, 3)}))
              except Exception as exc:
                  print(json.dumps({'probe': path, 'error_type': type(exc).__name__,
                      'seconds': round(time.monotonic() - started, 3)}))
              raise SystemExit(1)

          health = call('/health')
          print(json.dumps({'runtime_version': health.get('version'), 'runtime_commit': health.get('commit')}))
          projects = call('/monitor/report/projects', {}).get('projects') or []
          print(json.dumps({'project_count': len(projects)}))
          if len(projects) < 2 or not isinstance(projects[1].get('project'), str):
              raise SystemExit(3)
          started = time.monotonic()
          report = call('/monitor/report/build', {'project': projects[1]['project'],
              'kind': 'week', 'end': datetime.datetime.now(datetime.timezone.utc).date().isoformat()})
          admission_seconds = time.monotonic() - started
          ticket = report.get('ticket')
          if not isinstance(ticket, str) or len(ticket) != 32:
              raise SystemExit(4)
          polls, longest_poll = 0, 0.0
          deadline = time.monotonic() + 360
          while report.get('pending') and time.monotonic() < deadline:
              time.sleep(2)
              poll_started = time.monotonic()
              report = call('/monitor/report/result', {'ticket': ticket})
              longest_poll = max(longest_poll, time.monotonic() - poll_started)
              polls += 1
          ok = (not report.get('pending') and isinstance(report.get('report'), dict)
                and bool(report.get('html')))
          print(json.dumps({'report_complete': ok, 'admission_seconds': round(admission_seconds, 3),
              'polls': polls, 'longest_poll_seconds': round(longest_poll, 3),
              'total_seconds': round(time.monotonic() - started, 3)}))
          raise SystemExit(0 if ok else 1)
          PY
