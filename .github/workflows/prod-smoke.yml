name: Проверка источников финансирования

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnose-funding-sources
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Проверить наличие и агрегаты источников без публикации данных
        env:
          ADMIN_KEY: ${{ secrets.DEVELOPAID_ADMIN_KEY }}
        run: |
          python3 - <<'PY'
          """Bounded read-only funding-source diagnostics. Never print private values."""
          import datetime as dt
          import json
          import math
          import os
          import re
          import sys
          import time
          import urllib.error
          import urllib.request

          BASE = 'https://developaid.ru'
          CUT = '2026-10-31'
          RUNTIMES = {
              ('0.28.61', '7ebaffe6426fb9abba9ad2985ffe0e05c48504ae'),
              ('0.28.62', '930fc72158518ac480b21a1d2fb5bebf6d70afef'),
          }
          POSTS = frozenset(('/monitor/report/projects', '/monitor/budget/list',
                             '/monitor/report/build', '/monitor/report/result'))
          MAX_BODY = 16 * 1024 * 1024
          MAX_PROJECTS = 4
          ALLOWED = frozenset('''status error_type http_status runtime_version runtime_commit index project_count
          request_count build_count report_complete polls total_seconds admission_seconds longest_poll_seconds
          source_baseline_present source_estimate_present source_schedule_present source_budget_present
          monthly_budget_files monthly_budget_removed monthly_budget_month_count monthly_budget_supplies_cut
          limit_known need_basis_model budget_sections_count admin_section_present admin_fields_complete
          admin_leaf_detail_present admin_leaf_count taxes_listed_separately tax_section_count
          admin_tax_leaf_exclusion_verified budget_sections_sum_identity budget_fact_plan_identity
          chapter_count outside_chapter_count chapter_fields_complete chapter_remaining_identity
          chapter_gap_identity sum_gap_need_identity own_remaining_identity own_budget_need_identity aggregate_invariants_passed
          source_dates_present report_cut_matches report_date budget_data_date budget_uploaded_date
          budget_after_cut rss_data_date rss_uploaded_date rss_after_cut schedule_used schedule_data_date
          schedule_uploaded_date schedule_after_cut raw_payment_ids_available full_primary_reconciliation_possible'''.split())
          SECONDS = frozenset(('total_seconds', 'admission_seconds', 'longest_poll_seconds'))
          DATES = frozenset(k for k in ALLOWED if k.endswith('_date'))
          COUNTS = frozenset(k for k in ALLOWED if k.endswith('_count')) | frozenset((
              'index', 'polls', 'http_status', 'monthly_budget_files', 'monthly_budget_removed'))
          ERRORS = frozenset(('configuration', 'runtime_refused', 'http_status', 'transport',
                              'json_shape', 'body_limit', 'request_timeout', 'deadline', 'internal'))


          class ProbeError(Exception):
              def __init__(self, code, status=None):
                  self.code = code if code in ERRORS else 'internal'
                  self.status = status if type(status) is int and 100 <= status <= 599 else None


          def emit(**record):
              # Defense in depth: output cannot acquire a client string or money field.
              if not set(record) <= ALLOWED:
                  raise ProbeError('internal')
              for key, value in record.items():
                  if value is None or type(value) is bool:
                      continue
                  if key in COUNTS:
                      if type(value) is not int or not 0 <= value <= 100000:
                          raise ProbeError('internal')
                  elif key in SECONDS:
                      if type(value) not in (int, float) or not math.isfinite(value) or not 0 <= value <= 1800:
                          raise ProbeError('internal')
                  elif key in DATES:
                      if iso_day(value) != value:
                          raise ProbeError('internal')
                  elif key == 'status':
                      if value not in ('ok', 'partial', 'error'):
                          raise ProbeError('internal')
                  elif key == 'error_type':
                      if value not in ERRORS:
                          raise ProbeError('internal')
                  elif key == 'runtime_version':
                      if value not in {p[0] for p in RUNTIMES}:
                          raise ProbeError('internal')
                  elif key == 'runtime_commit':
                      if value not in {p[1] for p in RUNTIMES}:
                          raise ProbeError('internal')
                  else:
                      raise ProbeError('internal')
              print(json.dumps(record, sort_keys=True), flush=True)


          def iso_day(value):
              if not isinstance(value, str) or not re.fullmatch(r'\d{4}-\d{2}-\d{2}(?:T.{1,40})?', value):
                  return None
              try:
                  return dt.date.fromisoformat(value[:10]).isoformat()
              except ValueError:
                  return None


          def obj(value, optional=False):
              if value is None and optional:
                  return {}
              if not isinstance(value, dict):
                  raise ProbeError('json_shape')
              return value


          def records(value, maximum, optional=False):
              if value is None and optional:
                  return None
              if not isinstance(value, list) or len(value) > maximum or any(not isinstance(v, dict) for v in value):
                  raise ProbeError('json_shape')
              return value


          def num(value):
              try:
                  return float(value) if type(value) in (int, float) and math.isfinite(value) else None
              except (ValueError, OverflowError):
                  return None


          def total(values):
              values = [num(v) for v in values]
              if not values or any(v is None for v in values):
                  return None
              try:
                  return num(math.fsum(values))
              except (ValueError, OverflowError):
                  return None


          def arithmetic(parts, expected):
              left, right = total(parts), num(expected)
              return None if left is None or right is None else abs(left - right) <= 1.0


          def difference(a, b):
              a, b = num(a), num(b)
              return None if a is None or b is None else num(a - b)


          def all_checks(values):
              return False if any(v is False for v in values) else (None if not values or any(v is None for v in values) else all(values))


          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None


          def unique_object(pairs):
              out = {}
              for key, value in pairs:
                  if key in out:
                      raise ProbeError('json_shape')
                  out[key] = value
              return out


          def bad_constant(value):
              raise ProbeError('json_shape')


          class Transport:
              def __init__(self):
                  self.opener = urllib.request.build_opener(NoRedirect)
                  self.key = None
                  self.runtime = None
                  self.requests = 0
                  self.builds = 0

              def _json(self, path, payload=None, timeout=15):
                  if (path != '/health' and path not in POSTS) or (path == '/health') != (payload is None):
                      raise ProbeError('internal')
                  data = None if payload is None else json.dumps(dict(payload, key=self.key, session='')).encode()
                  request = urllib.request.Request(BASE + path, data=data,
                      headers={'Accept': 'application/json', **({'Content-Type': 'application/json'} if data else {})})
                  self.requests += 1
                  try:
                      with self.opener.open(request, timeout=min(15, timeout)) as response:
                          if response.status not in ((200,) if path in ('/health', '/monitor/report/projects', '/monitor/budget/list') else (200, 202)):
                              raise ProbeError('http_status', response.status)
                          if response.geturl() != BASE + path:
                              raise ProbeError('transport')
                          if not response.headers.get('Content-Type', '').lower().startswith('application/json'):
                              raise ProbeError('json_shape')
                          raw = response.read(MAX_BODY + 1)
                          if len(raw) > MAX_BODY:
                              raise ProbeError('body_limit')
                          result = json.loads(raw, parse_constant=bad_constant, object_pairs_hook=unique_object)
                          return obj(result)
                  except ProbeError:
                      raise
                  except urllib.error.HTTPError as exc:
                      # No response body, redirect Location, exception text or URL is printed.
                      raise ProbeError('http_status', exc.code) from None
                  except (ValueError, UnicodeError, RecursionError):
                      raise ProbeError('json_shape') from None
                  except TimeoutError:
                      raise ProbeError('request_timeout') from None
                  except Exception:
                      raise ProbeError('transport') from None

              def check_runtime(self, timeout=15):
                  value = self._json('/health', timeout=timeout)
                  pair = (value.get('version'), value.get('commit'))
                  if value.get('status') != 'ok' or pair not in RUNTIMES:
                      raise ProbeError('runtime_refused')
                  self.runtime = pair
                  return pair

              def post(self, path, payload, timeout=15):
                  # Recheck before EVERY secret-bearing request, including result polls.
                  started = time.monotonic()
                  self.check_runtime(timeout)
                  timeout -= time.monotonic() - started
                  if timeout <= 0:
                      raise ProbeError('request_timeout')
                  if not self.key or path not in POSTS or not isinstance(payload, dict):
                      raise ProbeError('configuration')
                  if path == '/monitor/report/build':
                      self.builds += 1
                      if self.builds > MAX_PROJECTS:
                          raise ProbeError('internal')
                  return self._json(path, payload, timeout)


          def budget_metadata(payload):
              active = records(payload.get('files'), 128)
              removed = records(payload.get('removed'), 128)
              months, supplied = set(), set()
              for item in active:
                  for name, target in (('months', months), ('supplies', supplied)):
                      values = item.get(name)
                      if not isinstance(values, list) or len(values) > 600:
                          raise ProbeError('json_shape')
                      for value in values:
                          if not isinstance(value, str) or not re.fullmatch(r'\d{4}-(?:0[1-9]|1[0-2])', value):
                              raise ProbeError('json_shape')
                          target.add(value)
              return {'monthly_budget_files': len(active), 'monthly_budget_removed': len(removed),
                      'monthly_budget_month_count': len(months), 'monthly_budget_supplies_cut': CUT[:7] in supplied}


          def funding_metrics(report):
              funding = obj(report.get('funding'), optional=True)
              limit = obj(funding.get('limit'), optional=True)
              comp = obj(limit.get('budget_composition'), optional=True)
              sections = records(comp.get('sections'), 128, optional=True)
              taxes = records(comp.get('taxes'), 128, optional=True)
              leaves = records(comp.get('admin_items'), 20000, optional=True)
              admins = [] if sections is None else [s for s in sections if s.get('code') == '2.4']
              admin = admins[0] if len(admins) == 1 else {}
              own = obj(limit.get('own_money'), optional=True)
              rows = records(own.get('rows'), 128, optional=True)
              chapter_rows = [] if rows is None else [r for r in rows if r.get('chapter') in ('1', '2', '3')]
              remain = [arithmetic([r.get('limit'), -num(r['paid']) if num(r.get('paid')) is not None else None], r.get('left')) for r in chapter_rows]
              gaps = [arithmetic([r.get('paid'), r.get('to_pay'), -num(r['limit']) if num(r.get('limit')) is not None else None], r.get('amount')) for r in chapter_rows]
              dates = obj(limit.get('source_dates'), optional=True)
              result = {
                  'limit_known': limit.get('known') if type(limit.get('known')) is bool else None,
                  'need_basis_model': (limit['need_basis'] == 'model') if limit.get('need_basis') in ('model', 'budget') else None,
                  'budget_sections_count': None if sections is None else len(sections),
                  'admin_section_present': None if sections is None else len(admins) == 1,
                  'admin_fields_complete': None if not admin else all(num(admin.get(k)) is not None for k in ('total', 'fact', 'plan')),
                  'admin_leaf_detail_present': leaves is not None,
                  'admin_leaf_count': None if leaves is None else len(leaves),
                  'taxes_listed_separately': (bool(taxes) and all(s.get('code') != '2.4.5' for s in sections)
                                             and all(t.get('code') == '2.4.5' for t in taxes)) if taxes is not None and sections is not None else None,
                  'tax_section_count': None if taxes is None else len(taxes),
                  # Section aggregates cannot prove which tax leaves were excluded.
                  'admin_tax_leaf_exclusion_verified': None,
                  'budget_sections_sum_identity': arithmetic([s.get('total') for s in sections], comp.get('total')) if sections is not None else None,
                  'budget_fact_plan_identity': arithmetic([comp.get('fact'), comp.get('plan')], comp.get('total')),
                  'chapter_count': None if rows is None else len(chapter_rows),
                  'outside_chapter_count': None if rows is None else len(rows) - len(chapter_rows),
                  'chapter_fields_complete': (all(num(r.get(k)) is not None for r in chapter_rows for k in ('limit', 'paid', 'left', 'to_pay', 'amount')) if chapter_rows else None),
                  'chapter_remaining_identity': all_checks(remain),
                  'chapter_gap_identity': all_checks(gaps),
                  'sum_gap_need_identity': arithmetic([r.get('amount') for r in rows], own.get('need')) if rows is not None else None,
                  'own_remaining_identity': arithmetic([own.get('paid'), own.get('left')], own.get('limit')),
                  'own_budget_need_identity': arithmetic([own.get('limit'), own.get('model_over_schedule'), own.get('accounting'), own.get('need')], own.get('budget')),
                  'source_dates_present': bool(dates),
                  'report_date': iso_day(dates.get('report_date')),
                  'report_cut_matches': (iso_day(dates['report_date']) == CUT) if iso_day(dates.get('report_date')) is not None else None,
                  'schedule_used': dates.get('schedule_used') if type(dates.get('schedule_used')) is bool else None,
                  # Existing APIs omit payment IDs and original row-coverage evidence.
                  'raw_payment_ids_available': False,
                  'full_primary_reconciliation_possible': False,
              }
              for name in ('budget', 'rss', 'schedule'):
                  source = obj(dates.get(name), optional=True)
                  value = iso_day(source.get('data_date'))
                  result[name + '_data_date'] = value
                  result[name + '_uploaded_date'] = iso_day(source.get('uploaded_at'))
                  result[name + '_after_cut'] = (value > CUT) if value is not None else None
              result['aggregate_invariants_passed'] = all_checks([result[k] for k in (
                  'budget_sections_sum_identity', 'budget_fact_plan_identity', 'chapter_remaining_identity',
                  'chapter_gap_identity', 'sum_gap_need_identity', 'own_remaining_identity', 'own_budget_need_identity')])
              return result


          def project_report(transport, project):
              started = time.monotonic()
              value = transport.post('/monitor/report/build', {'project': project, 'kind': 'month', 'end': CUT})
              admission = time.monotonic() - started
              ticket = value.get('ticket')
              if not isinstance(ticket, str) or not re.fullmatch(r'[0-9a-f]{32}', ticket):
                  raise ProbeError('json_shape')
              polls, longest = 0, 0.0
              deadline = started + 360
              while True:
                  if type(value.get('pending')) is not bool or value.get('ticket') != ticket:
                      raise ProbeError('json_shape')
                  if value['pending'] is False:
                      break
                  if time.monotonic() >= deadline:
                      raise ProbeError('deadline')
                  time.sleep(min(2, max(0, deadline - time.monotonic())))
                  if time.monotonic() >= deadline:
                      raise ProbeError('deadline')
                  before = time.monotonic()
                  value = transport.post('/monitor/report/result', {'ticket': ticket}, min(15, deadline - before))
                  longest = max(longest, time.monotonic() - before)
                  polls += 1
              if not isinstance(value.get('report'), dict) or not isinstance(value.get('html'), str) or not value['html']:
                  raise ProbeError('json_shape')
              return value['report'], {'report_complete': True, 'admission_seconds': round(admission, 3),
                                       'polls': polls, 'longest_poll_seconds': round(longest, 3),
                                       'total_seconds': round(time.monotonic() - started, 3)}


          def run():
              transport = Transport()
              version, commit = transport.check_runtime()
              emit(status='ok', runtime_version=version, runtime_commit=commit,
                   full_primary_reconciliation_possible=False)
              # Read the existing binding only after a reviewed runtime is confirmed.
              transport.key = os.environ.get('ADMIN_KEY', '')
              if not isinstance(transport.key, str) or not transport.key or len(transport.key) > 4096:
                  raise ProbeError('configuration')
              payload = transport.post('/monitor/report/projects', {})
              projects = records(payload.get('projects'), MAX_PROJECTS)
              if not projects:
                  raise ProbeError('json_shape')
              names = []
              for project in projects:
                  name, data = project.get('project'), project.get('data')
                  if (not isinstance(name, str) or not name.strip() or len(name) > 256
                          or any(ord(c) < 32 for c in name) or name in names
                          or not isinstance(data, list) or len(data) > 32
                          or any(not isinstance(kind, str) or len(kind) > 64 for kind in data)):
                      raise ProbeError('json_shape')
                  names.append(name)
              emit(status='ok', project_count=len(projects))
              outcomes = []
              for index, (name, project) in enumerate(zip(names, projects)):
                  metadata = budget_metadata(transport.post('/monitor/budget/list', {'project': name}))
                  report, timing = project_report(transport, name)
                  metrics = funding_metrics(report)
                  kinds = project['data']
                  version, commit = transport.runtime
                  status = 'ok' if (metrics['limit_known'] is True and metrics['report_cut_matches'] is True
                                    and metrics['aggregate_invariants_passed'] is True
                                    and metrics['budget_after_cut'] is False and metrics['rss_after_cut'] is False) else 'partial'
                  outcomes.append(status)
                  emit(status=status, index=index, runtime_version=version, runtime_commit=commit,
                       source_baseline_present='baseline' in kinds, source_estimate_present='estimate' in kinds,
                       source_schedule_present='funding_schedule' in kinds, source_budget_present='budget' in kinds,
                       **metadata, **timing, **metrics)
              emit(status='ok' if all(s == 'ok' for s in outcomes) else 'partial',
                   request_count=transport.requests, build_count=transport.builds,
                   project_count=len(projects), full_primary_reconciliation_possible=False)
              return 0


          def main():
              try:
                  return run()
              except ProbeError as exc:
                  emit(status='error', error_type=exc.code, http_status=exc.status,
                       full_primary_reconciliation_possible=False)
                  return 1
              except Exception:
                  emit(status='error', error_type='internal', full_primary_reconciliation_possible=False)
                  return 1


          if __name__ == '__main__':
              raise SystemExit(main())
          PY
