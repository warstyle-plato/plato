name: Проверка прода после выката

# Тест PR проверяет код, а не то, что видит пользователь: тизер КРТ Нагатино
# рисовал 10 участков из 20, из выгрузки торгов пропали примечания, а CI был
# зелёный. Здесь готовые поверхности живого прода проверяются на эталонном
# проекте (scripts/prod_smoke_reference.json) сразу после выката.
#
# Только чтение и по одному запросу на поверхность: проекты пользователей не
# трогаются, нагрузка — один эталонный проект.

# Запускает её последний шаг сборки (build-yandex.yml, задание «Проверка прода
# после выката»), а не `workflow_run`: сборку диспатчит release-merge токеном
# GITHUB_TOKEN, а прогоны, порождённые этим токеном, `workflow_run` не будят —
# ни один выпуск не проверился сам, пока триггер стоял здесь. Диспатч же от
# GITHUB_TOKEN прогон создаёт. Второго триггера нет, чтобы один выпуск не
# проверялся дважды и прогоны не снимали друг друга через concurrency.
on:
  workflow_dispatch:
    inputs:
      base:
        description: Адрес прода
        default: https://developaid.ru
      expect_commit:
        description: Коммит, который должен отдавать /health (пусто — не ждать)
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: prod-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Поверхности прода
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE: ${{ github.event.inputs.base || 'https://developaid.ru' }}
      EXPECT_COMMIT: ${{ github.event.inputs.expect_commit }}
    steps:
      # Код проверки — с ветки, на которой запущен диспатч (сборка шлёт его
      # на main), а не из ожидаемого коммита: у прогона есть секреты и право
      # писать issue. Ожидаемый коммит — только строка, которую ждём в /health.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pypdf playwright

      - name: Браузер для страницы «Итог»
        run: python -m playwright install --with-deps chromium

      - name: Последний слитый PR
        id: pr
        run: |
          # Номер из заголовка merge/squash-коммита: «… (#541)».
          last=$(git log -1 --format=%s | grep -oE '#[0-9]+' | tail -1 || true)
          echo "last_pr=${last:-не определён} ($(git log -1 --format=%h))" >> "$GITHUB_OUTPUT"

      - name: Проверка прода
        id: smoke
        env:
          LAST_PR: ${{ steps.pr.outputs.last_pr }}
          # Тизер и экономика «Итога» — за входом; без ключа они пропускаются
          # с этой причиной в итоге, а не зеленеют.
          PROD_SMOKE_ADMIN_KEY: ${{ secrets.DEVELOPAID_ADMIN_KEY }}
          # Торги закрыты входом, пока есть личные ключи; /auctions/login
          # принимает ключ кабинета рынка или общий AUCTIONS_VIEW_KEY, но не
          # ключ владельца. Без секрета шаг 3 пропускается с этой причиной.
          PROD_SMOKE_AUCTIONS_KEY: ${{ secrets.PROD_SMOKE_AUCTIONS_KEY }}
        run: |
          args=(--base "$BASE" --summary smoke-summary.md --json smoke-result.json
                --out smoke-out --last-pr "$LAST_PR")
          if [ -n "$EXPECT_COMMIT" ]; then
            # Не проверять старый образ: ждём, пока прод отдаст этот коммит
            # (а если /health commit пуст — версию из этого же коммита).
            args+=(--wait-commit "$EXPECT_COMMIT" --wait-timeout 2400)
            # Запасная сверка по версии (если /health не отдаёт commit) —
            # только когда на руках тот самый коммит: иначе версия чужая.
            if [ "$(git rev-parse HEAD)" = "$EXPECT_COMMIT" ]; then
              version=$(grep -m1 '^VERSION = ' main_legacy.py | cut -d'"' -f2)
              args+=(--wait-version "$version")
            fi
          fi
          set +e
          python3 scripts/prod_smoke.py "${args[@]}"
          code=$?
          set -e
          # Скрипт пишет итог всегда; не записал — упал сам. Это тоже красный
          # прогон с названной причиной, а не молчание: без файла итога шаг
          # раньше падал на `cat`, и issue не создавался.
          if [ ! -s smoke-summary.md ]; then
            printf '## ❌ Прод: прогон упал без итога\n\n`scripts/prod_smoke.py` завершился с кодом %s и не записал таблицу итога; проверки после места падения не выполнены. Причина — в журнале шага «Проверка прода».\n' "$code" > smoke-summary.md
            if [ "$code" = 0 ]; then code=1; fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat smoke-summary.md >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Результат прогона
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prod-smoke
          path: |
            smoke-summary.md
            smoke-result.json
            smoke-out/
          if-no-files-found: ignore

      - name: Issue prod-regression
        # Красный шаг проверки — при любом исходе, в том числе без итога.
        # Упавшие зависимости/браузер сюда не ведут: шаг проверки тогда пропущен.
        if: failure() && steps.smoke.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.existsSync('smoke-summary.md')
              ? fs.readFileSync('smoke-summary.md', 'utf8')
              : '## ❌ Прод: прогон упал без итога\n\nТаблица итога не записана — причина в журнале шага «Проверка прода».';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const label = 'prod-regression';
            try {
              await github.rest.issues.getLabel({...context.repo, name: label});
            } catch (e) {
              await github.rest.issues.createLabel({...context.repo, name: label, color: 'b60205',
                description: 'Проверка прода после выката нашла поломку'});
            }
            const open = await github.rest.issues.listForRepo({...context.repo, state: 'open', labels: label, per_page: 1});
            if (open.data.length) {
              // Открытая уже есть — дописываем прогон туда, новую не плодим.
              await github.rest.issues.createComment({...context.repo, issue_number: open.data[0].number,
                body: `Снова красно: ${run}\n\n${body}`});
              return;
            }
            await github.rest.issues.create({...context.repo, title: 'Прод: проверка поверхностей после выката красная',
              labels: [label], body: `Прогон: ${run}\n\n${body}`});

  # Визуал: что человек видит на экране прода (scripts/prod_visual.py) —
  # «undefined»/«NaN», пустые блоки, прочерк вместо числа, прокрутка вбок на
  # телефоне, одно число по-разному на странице, в PDF и в тизере, жаргон.
  # Тот же диспатч, что у проверки поверхностей, — один прогон на выкат; ждёт
  # её, чтобы не нагружать прод двумя прогонами сразу. Не гейт: красным
  # задание становится только от явной поломки, остальное — замечания.
  # Новое после выката уходит комментарием в PR выката (его сессия-автор
  # подписана на PR); давнее и то, чему автора нет, — одной issue владельцу.
  visual:
    name: Визуал прода
    needs: smoke
    # И при красной проверке поверхностей: экран смотрится независимо от неё.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BASE: ${{ github.event.inputs.base || 'https://developaid.ru' }}
      EXPECT_COMMIT: ${{ github.event.inputs.expect_commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install pypdf playwright
          python -m playwright install --with-deps chromium

      - name: PR выката
        id: pr
        run: |
          # Номер из заголовка merge/squash-коммита выката: «… (#541)».
          ref="${EXPECT_COMMIT:-HEAD}"
          git cat-file -e "$ref^{commit}" 2>/dev/null || ref=HEAD
          pr=$(git log -1 --format=%s "$ref" | grep -oE '#[0-9]+' | tail -1 | tr -d '#' || true)
          echo "number=$pr" >> "$GITHUB_OUTPUT"
          echo "label=${pr:+#$pr}${pr:-не определён} ($(git log -1 --format=%h "$ref"))" >> "$GITHUB_OUTPUT"

      # База «что было до выката» — итог прошлого полного прогона.
      - name: Прошлый прогон
        uses: actions/cache/restore@v6
        with:
          path: visual-baseline.json
          key: prod-visual-baseline-${{ github.run_id }}
          restore-keys: prod-visual-baseline-

      - name: Визуальная проверка
        id: visual
        env:
          PROD_SMOKE_ADMIN_KEY: ${{ secrets.DEVELOPAID_ADMIN_KEY }}
        run: |
          args=(--base "$BASE" --summary visual-summary.md --json visual-result.json
                --author-note visual-author.md --out visual-out
                --last-pr "${{ steps.pr.outputs.label }}" --baseline visual-baseline.json)
          if [ -n "$EXPECT_COMMIT" ]; then
            # Проверка поверхностей уже дождалась выката; здесь — только
            # убедиться, что прод всё ещё отдаёт этот коммит.
            args+=(--wait-commit "$EXPECT_COMMIT" --wait-timeout 600)
          fi
          set +e
          python3 scripts/prod_visual.py "${args[@]}"
          code=$?
          set -e
          if [ ! -s visual-summary.md ]; then
            printf '## ❌ Визуал прода: прогон упал без итога\n\n`scripts/prod_visual.py` завершился с кодом %s; причина — в журнале шага «Визуальная проверка».\n' "$code" > visual-summary.md
            if [ "$code" = 0 ]; then code=1; fi
          fi
          cat visual-summary.md >> "$GITHUB_STEP_SUMMARY"
          if [ -s visual-result.json ] && python3 -c "import json,sys; sys.exit(0 if json.load(open('visual-result.json')).get('complete') else 1)"; then
            cp visual-result.json visual-baseline.json
            echo "baseline=1" >> "$GITHUB_OUTPUT"
          fi
          exit $code

      - name: Запомнить прогон
        if: always() && steps.visual.outputs.baseline == '1'
        uses: actions/cache/save@v6
        with:
          path: visual-baseline.json
          key: prod-visual-baseline-${{ github.run_id }}

      - name: Снимки и замечания
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prod-visual
          path: |
            visual-summary.md
            visual-result.json
            visual-author.md
            visual-out/
          if-no-files-found: ignore

      - name: Замечания — автору и владельцу
        if: always() && steps.visual.outcome != 'skipped'
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          script: |
            const fs = require('fs');
            const read = f => fs.existsSync(f) ? fs.readFileSync(f, 'utf8') : '';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const author = read('visual-author.md');
            const summary = read('visual-summary.md');
            const result = (() => { try { return JSON.parse(read('visual-result.json')); } catch (e) { return {}; } })();
            const pr = Number(process.env.PR_NUMBER || 0);
            let routed = false;
            // Новое — автору выката, в его PR.
            if (author && pr) {
              try {
                await github.rest.issues.createComment({...context.repo, issue_number: pr,
                  body: `${author}\nПрогон и снимки: ${run}`});
                routed = true;
              } catch (e) { core.warning(`PR #${pr}: комментарий не записан — ${e.message}`); }
            }
            // Давнее и безадресное — одна issue владельцу, текст обновляется, новые не плодятся.
            const label = 'prod-visual';
            try { await github.rest.issues.getLabel({...context.repo, name: label}); }
            catch (e) { await github.rest.issues.createLabel({...context.repo, name: label, color: 'fbca04',
              description: 'Визуальная проверка прода: замечания без автора'}); }
            const open = await github.rest.issues.listForRepo({...context.repo, state: 'open', labels: label, per_page: 1});
            const issue = open.data[0];
            const any = (result.findings || []).length > 0 || !result.findings;
            const unrouted = author && !routed
              ? '\n\n**Автора выката определить не удалось — новое тоже здесь.**\n' : '';
            const body = `Прогон: ${run}${unrouted}\n\n${summary}`;
            if (!any) {
              // Закрывает только полный прогон: пропуск без ключа — не «чисто».
              if (issue && result.complete) {
                await github.rest.issues.createComment({...context.repo, issue_number: issue.number,
                  body: `Замечаний больше нет: ${run}`});
                await github.rest.issues.update({...context.repo, issue_number: issue.number, state: 'closed',
                  state_reason: 'completed'});
              }
              return;
            }
            if (issue) {
              await github.rest.issues.update({...context.repo, issue_number: issue.number, body});
              if (author && !routed) await github.rest.issues.createComment({...context.repo,
                issue_number: issue.number, body: `Новое после выката, автор не определён: ${run}\n\n${author}`});
            } else {
              await github.rest.issues.create({...context.repo, title: 'Прод: визуальные замечания на экране',
                labels: [label], body});
            }
