name: Диагностика наличия данных Монитора
run-name: monitor-data-probe

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact deployed runtime commit, verified before authorization
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: monitor-data-diagnostic
  cancel-in-progress: false

jobs:
  probe:
    name: Проверить наличие данных без публикации содержимого
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Проверка защищённых данных
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          PROBE_ADMIN_KEY: ${{ secrets.DEVELOPAID_ADMIN_KEY }}
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import math
          import os
          import re
          import signal
          import sys
          import time
          import urllib.error
          import urllib.request
          from zoneinfo import ZoneInfo

          BASE = 'https://developaid.ru'
          MAX_BYTES = 16 * 1024 * 1024
          TOTAL_SECONDS = 360
          HTTP_SECONDS = 15
          POLL_SECONDS = 2
          POST_PATHS = frozenset({
              '/monitor/report/projects', '/monitor/contracts/build',
              '/monitor/contracts/result', '/monitor/report/build',
              '/monitor/report/result',
          })
          REASONS = frozenset({
              'invalid_expected_commit', 'deadline', 'redirect_denied', 'http_auth',
              'http_capacity', 'http_failure', 'transport_failure', 'response_too_large',
              'invalid_json', 'invalid_payload', 'runtime_mismatch', 'missing_secret',
              'project_selection_unverified', 'invalid_ticket', 'ticket_changed',
              'job_rejected', 'contracts_missing', 'report_missing', 'unexpected_error',
          })
          FLAG_NAMES = (
              'contracts_present', 'any_contract_price', 'all_contract_prices',
              'any_dated_money', 'all_dated_money',
              'any_reference_money', 'all_rows_have_dated_or_reference_money',
              'ratio_present', 'all_ratios', 'any_rss_financial_source',
              'rss_snapshot_present', 'rss_read_failed',
              'any_physical_positions', 'references_safety_metadata_complete',
              'gpr_any_corpora', 'gpr_source_present', 'gpr_network_present',
              'rnv_qualification_present', 'rnv_complete', 'rnv_partial', 'rnv_unknown',
          )


          class ProbeError(Exception):
              def __init__(self, code):
                  self.code = code if code in REASONS else 'unexpected_error'
                  super().__init__(self.code)


          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise ProbeError('redirect_denied')


          def mapping(value):
              if value is None:
                  return {}
              if not isinstance(value, dict):
                  raise ProbeError('invalid_payload')
              return value


          def records(value):
              if value is None:
                  return []
              if not isinstance(value, list) or any(not isinstance(x, dict) for x in value):
                  raise ProbeError('invalid_payload')
              return value


          def number(value):
              if not isinstance(value, (int, float)) or isinstance(value, bool):
                  return False
              try:
                  return math.isfinite(value)
              except (OverflowError, ValueError):
                  return False


          class Probe:
              def __init__(self, expected, *, opener=None, clock=time.monotonic, sleep=time.sleep):
                  if not isinstance(expected, str) or not re.fullmatch('[0-9a-f]{40}', expected):
                      raise ProbeError('invalid_expected_commit')
                  self.expected = expected
                  self.opener = opener or urllib.request.build_opener(NoRedirect())
                  self.clock, self.sleep = clock, sleep
                  self.deadline = clock() + TOTAL_SECONDS

              def remaining(self):
                  remaining = self.deadline - self.clock()
                  if remaining <= 0:
                      raise ProbeError('deadline')
                  return remaining

              def request(self, path, body=None):
                  if (body is None and path != '/health') or (body is not None and path not in POST_PATHS):
                      raise ProbeError('invalid_payload')
                  headers = {'Cache-Control': 'no-cache', 'User-Agent': 'PLATO-Monitor-Data-Probe/1'}
                  raw = None
                  if body is not None:
                      if not isinstance(body, dict):
                          raise ProbeError('invalid_payload')
                      raw = json.dumps(body, ensure_ascii=False, allow_nan=False).encode('utf-8')
                      headers['Content-Type'] = 'application/json'
                  request = urllib.request.Request(BASE + path, data=raw, headers=headers,
                                                   method='POST' if body is not None else 'GET')
                  try:
                      with self.opener.open(request, timeout=min(HTTP_SECONDS, self.remaining())) as response:
                          if response.geturl() != BASE + path:
                              raise ProbeError('redirect_denied')
                          if response.status not in (200, 202):
                              raise ProbeError('http_failure')
                          chunks, size = [], 0
                          # read1 avoids waiting for an entire 64KiB buffer on a slow stream.
                          while True:
                              self.remaining()
                              chunk = response.read1(min(65536, MAX_BYTES - size + 1))
                              self.remaining()
                              if not chunk:
                                  break
                              size += len(chunk)
                              if size > MAX_BYTES:
                                  raise ProbeError('response_too_large')
                              chunks.append(chunk)
                          payload = b''.join(chunks)
                      self.remaining()
                  except urllib.error.HTTPError as exc:
                      if exc.code in (301, 302, 303, 307, 308):
                          raise ProbeError('redirect_denied') from None
                      if exc.code in (401, 403):
                          raise ProbeError('http_auth') from None
                      if exc.code == 429:
                          raise ProbeError('http_capacity') from None
                      raise ProbeError('http_failure') from None
                  except (urllib.error.URLError, OSError, TimeoutError):
                      raise ProbeError('transport_failure') from None
                  try:
                      result = json.loads(payload)
                  except (ValueError, UnicodeError):
                      raise ProbeError('invalid_json') from None
                  if not isinstance(result, dict):
                      raise ProbeError('invalid_payload')
                  return result

              def health(self):
                  payload = self.request('/health')
                  version = payload.get('version')
                  if (payload.get('status') != 'ok' or payload.get('commit') != self.expected
                          or not isinstance(version, str)
                          or not re.fullmatch(r'[0-9]{1,6}\.[0-9]{1,6}\.[0-9]{1,6}', version)):
                      raise ProbeError('runtime_mismatch')
                  return version

              def job(self, build_path, result_path, body, key):
                  # Exactly one admission; no blind retries or business mutations.
                  payload = self.request(build_path, {**body, 'key': key})
                  ticket = None
                  while True:
                      if payload.get('ok') is False:
                          raise ProbeError('job_rejected')
                      pending = payload.get('pending')
                      current = payload.get('ticket')
                      if (type(pending) is not bool or not isinstance(current, str)
                              or not re.fullmatch('[0-9a-f]{32}', current)):
                          raise ProbeError('invalid_ticket')
                      if ticket is not None and current != ticket:
                          raise ProbeError('ticket_changed')
                      ticket = current
                      if not pending:
                          return payload
                      self.remaining()
                      self.sleep(min(POLL_SECONDS, self.remaining()))
                      self.remaining()
                      payload = self.request(result_path, {'key': key, 'ticket': ticket})

              def run(self, key_getter):
                  first_version = self.health()
                  # The key is not even read until the exact public runtime gate succeeds.
                  key = key_getter()
                  if not isinstance(key, str) or not key.strip() or len(key) > 4096:
                      raise ProbeError('missing_secret')
                  key = key.strip()
                  projects = self.request('/monitor/report/projects', {'key': key})
                  options = records(projects.get('projects'))
                  if len(options) != 2:
                      raise ProbeError('project_selection_unverified')
                  project = options[1].get('project')
                  if not isinstance(project, str) or not project.strip() or len(project) > 200:
                      raise ProbeError('project_selection_unverified')
                  day = datetime.datetime.now(ZoneInfo('Europe/Moscow')).date().isoformat()
                  result = self.job('/monitor/contracts/build', '/monitor/contracts/result',
                                    {'project': project, 'cut': day}, key)
                  register = result.get('register')
                  if not isinstance(register, dict) or 'rows' not in register:
                      raise ProbeError('contracts_missing')
                  rows = records(register['rows'])
                  all_refs = [ref for row in rows for ref in records(row.get('reported_performance_sources'))]
                  rss_snapshot = mapping(register.get('snapshots')).get('rss')
                  try:
                      rss_snapshot_present = (isinstance(rss_snapshot, str)
                          and datetime.date.fromisoformat(rss_snapshot).isoformat() == rss_snapshot)
                  except ValueError:
                      rss_snapshot_present = False
                  source_warnings = register.get('warnings')
                  if source_warnings is None:
                      source_warnings = []
                  if (not isinstance(source_warnings, list)
                          or any(not isinstance(warning, str) for warning in source_warnings)):
                      raise ProbeError('invalid_payload')

                  def reference(row):
                      return any(number(ref.get('completed'))
                                 and ref.get('future_periods_excluded') is not True
                                 for ref in records(row.get('reported_performance_sources')))

                  flags = {
                      'contracts_present': bool(rows),
                      'any_contract_price': any(number(row.get('amount')) for row in rows),
                      'all_contract_prices': bool(rows) and all(number(row.get('amount')) for row in rows),
                      'any_dated_money': any(number(row.get('completed')) for row in rows),
                      'all_dated_money': bool(rows) and all(number(row.get('completed')) for row in rows),
                      'any_reference_money': any(reference(row) for row in rows),
                      'all_rows_have_dated_or_reference_money': bool(rows) and all(
                          number(row.get('completed')) or reference(row) for row in rows),
                      'ratio_present': any(number(row.get('completion_ratio')) for row in rows),
                      'all_ratios': bool(rows) and all(number(row.get('completion_ratio')) for row in rows),
                      'any_rss_financial_source': any(
                          isinstance(source.get('label'), str) and source['label'].startswith('РСС')
                          for row in rows for source in records(row.get('financial_sources'))),
                      'rss_snapshot_present': rss_snapshot_present,
                      'rss_read_failed': any(warning in (
                          'Реестр договоров в выбранном снимке РСС не прочитан.',
                          'Строки реестра договоров РСС неоднозначны; денежные значения не объединены.',
                      ) for warning in source_warnings),
                      'any_physical_positions': any(bool(records(row.get('physical_items'))) for row in rows),
                      'references_safety_metadata_complete': bool(all_refs) and all(
                          type(ref.get('future_periods_excluded')) is bool
                          and type(ref.get('period_dates_known')) is bool for ref in all_refs),
                  }
                  report_result = self.job('/monitor/report/build', '/monitor/report/result',
                                           {'project': project, 'kind': 'week', 'end': day}, key)
                  report = report_result.get('report')
                  if not isinstance(report, dict):
                      raise ProbeError('report_missing')
                  gantt = mapping(report.get('gantt'))
                  source = mapping(gantt.get('corpus_gpr'))
                  timeline = mapping(gantt.get('dependency_timeline'))
                  schedule = mapping(report.get('schedule'))
                  qualification = mapping(schedule.get('qualification'))
                  complete = qualification.get('state') == 'complete' and schedule.get('known') is True
                  partial = qualification.get('state') == 'partial'
                  flags.update({
                      'gpr_any_corpora': bool(records(gantt.get('corpora'))),
                      'gpr_source_present': bool(records(source.get('packages'))),
                      'gpr_network_present': bool(records(timeline.get('rows'))),
                      'rnv_qualification_present': bool(qualification),
                      'rnv_complete': complete,
                      'rnv_partial': partial,
                      'rnv_unknown': not complete and not partial,
                  })
                  if self.health() != first_version:
                      raise ProbeError('runtime_mismatch')
                  if set(flags) != set(FLAG_NAMES) or any(type(value) is not bool for value in flags.values()):
                      raise ProbeError('invalid_payload')
                  return {'status': 'ok', 'runtime_version': first_version,
                          'runtime_commit': self.expected, **flags}


          def main():
              started = time.monotonic()

              def expired(signum, frame):
                  raise ProbeError('deadline')

              # Linux runner: the alarm also bounds slow streaming/JSON parsing, not just polling.
              signal.signal(signal.SIGALRM, expired)
              signal.alarm(TOTAL_SECONDS)
              try:
                  probe = Probe(os.environ.get('EXPECTED_COMMIT', ''))
                  result = probe.run(lambda: os.environ.get('PROBE_ADMIN_KEY', ''))
                  code = 0
              except ProbeError as exc:
                  result = {'status': 'error', 'error_type': 'ProbeError', 'reason_code': exc.code}
                  code = 1
              except Exception:
                  # Never print server bodies, request values, private identifiers, or exception text.
                  result = {'status': 'error', 'error_type': 'UnexpectedError', 'reason_code': 'unexpected_error'}
                  code = 1
              finally:
                  signal.alarm(0)
              result['seconds'] = round(max(0, time.monotonic() - started), 3)
              print(json.dumps(result, sort_keys=True, allow_nan=False))
              return code


          if __name__ == '__main__':
              sys.exit(main())
          PY
