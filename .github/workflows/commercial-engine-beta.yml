name: Commercial engine beta

on:
  push:
    branches: [feature/commercial-engine-v2]
  pull_request:
    branches: [main]
    paths:
      - "developaid_commercial.py"
      - "developaid_commercial_engine.py"
      - "commercial_preview.py"
      - "commercial_site*"
      - "developaid_commercial_form.py"
      - "developaid_commercial_site.py"
      - "main_registry.py"
      - "ia_preview/**"
      - "tests/test_developaid_commercial.py"
      - "tests/test_developaid_commercial_engine_v2.py"
      - "tests/test_commercial_preview_staging.py"
      - ".github/workflows/commercial-engine-beta.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commercial-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Commercial engine tests
        run: |
          python -m pytest -q \
            tests/test_developaid_commercial.py \
            tests/test_developaid_commercial_engine_v2.py \
            tests/test_commercial_preview_staging.py \
            tests/test_ia_preview_serves_the_page_itself.py \
            tests/test_ia_preview_layer_matches_the_page.py
