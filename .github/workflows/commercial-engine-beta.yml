name: Commercial engine beta

on:
  pull_request:
    branches: [main]
    paths:
      - "developaid_commercial.py"
      - "developaid_commercial_engine.py"
      - "tests/test_developaid_commercial.py"
      - "tests/test_developaid_commercial_engine_v2.py"
      - ".github/workflows/commercial-engine-beta.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commercial-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Commercial engine tests
        run: |
          python -m pytest -q             tests/test_developaid_commercial.py             tests/test_developaid_commercial_engine_v2.py
