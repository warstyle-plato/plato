name: Resolve PR 588 after 584

on:
  push:
    branches:
      - 'claude/terms-glossary'

permissions:
  contents: write

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge current main and preserve both 584 and 588
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main

          # PR #584 and #588 touch the same generated FIELD_GROUPS line in
          # main_legacy.py. Prefer current main in conflicting hunks so the
          # KRT buyout/deal logic from #584 cannot disappear; all clean #588
          # hunks merge normally. Then restore the glossary-owned rate hints
          # on that generated line explicitly below.
          git merge -X theirs --no-commit --no-ff origin/main

          python - <<'PY'
          from pathlib import Path

          path = Path('main_legacy.py')
          text = path.read_text(encoding='utf-8')

          # The only intentional overlap is the huge FIELD_GROUPS literal.
          # If the merge strategy kept the #584 version of that hunk, restore
          # #588's glossary import/helper and rate labels without touching the
          # #584 land_buyout_mln field that now belongs to main.
          glossary_import = 'from terms_glossary import CORE_TOTAL_AREA, TOTAL_AREA, page_terms'
          if glossary_import not in text:
              needle = 'import plato_provider\n'
              if needle not in text:
                  raise SystemExit('cannot place terms_glossary import')
              text = text.replace(
                  needle,
                  needle + '# Подписи величин — у словаря терминов, здесь только чтение.\n' + glossary_import + '\n',
                  1,
              )

          helper = (
              '# Ставка общепроектной статьи умножается на `core_total_gns` — суммарную\n'
              '# площадь МКД в ГНС; слово у словаря.\n'
              '_PER_TOTAL_AREA_HINT = f"тыс. ₽/м² {CORE_TOTAL_AREA.genitive} — наземная плюс подземная"\n'
          )
          if '_PER_TOTAL_AREA_HINT = ' not in text:
              needle = '_FIELD_GROUPS_LITERAL = [['
              if needle not in text:
                  raise SystemExit('cannot find FIELD_GROUPS literal')
              text = text.replace(needle, helper + needle, 1)

          simple = {
              "['ird_th_per_sqm', 'ИРД и согласования', 'тыс. ₽/м² строительного объёма — наземная плюс подземная', 'number']":
                  "['ird_th_per_sqm', 'ИРД и согласования', _PER_TOTAL_AREA_HINT, 'number']",
              "['design_p_th_per_sqm', 'Проектирование стадии П', 'тыс. ₽/м² строительного объёма — наземная плюс подземная', 'number']":
                  "['design_p_th_per_sqm', 'Проектирование стадии П', _PER_TOTAL_AREA_HINT, 'number']",
              "['design_rd_th_per_sqm', 'Проектирование стадии РД', 'тыс. ₽/м² строительного объёма — наземная плюс подземная', 'number']":
                  "['design_rd_th_per_sqm', 'Проектирование стадии РД', _PER_TOTAL_AREA_HINT, 'number']",
              "['preparation_th_per_sqm', 'Подготовительные работы', 'тыс. ₽/м² строительного объёма — наземная плюс подземная', 'number']":
                  "['preparation_th_per_sqm', 'Подготовительные работы', _PER_TOTAL_AREA_HINT, 'number']",
              "['commissioning_th_per_sqm', 'Сдача и ввод', 'тыс. ₽/м² строительного объёма — наземная плюс подземная', 'number']":
                  "['commissioning_th_per_sqm', 'Сдача и ввод', _PER_TOTAL_AREA_HINT, 'number']",
              "['site_maintenance_th_per_sqm', 'Содержание стройплощадки', 'тыс. ₽/м² строительного объёма — наземная плюс подземная', 'number']":
                  "['site_maintenance_th_per_sqm', 'Содержание стройплощадки', _PER_TOTAL_AREA_HINT, 'number']",
          }
          for old, new in simple.items():
              text = text.replace(old, new)

          old_util = "['utilities_th_per_sqm', 'Наружные инженерные сети, в т.ч. плата за техприсоединение', 'тыс. ₽/м² строительного объёма — наземная плюс подземная; ТП зависит от мощности, а не от метров — на длинном проекте проверяйте отдельно', 'number']"
          new_util = "['utilities_th_per_sqm', 'Наружные инженерные сети, в т.ч. плата за техприсоединение', _PER_TOTAL_AREA_HINT + '; ТП зависит от мощности, а не от метров — на длинном проекте проверяйте отдельно', 'number']"
          text = text.replace(old_util, new_util)

          required = [
              glossary_import,
              '_PER_TOTAL_AREA_HINT = ',
              'def sold_saleable_sqm(',
              'monetizable_saleable_sqm = sold_saleable_sqm(t, x)',
              'const TERMS=__DEVELOPAID_TERMS__;',
              'PAGE = PAGE.replace("__DEVELOPAID_TERMS__"',
              "'land_buyout_mln'",
              '_land_buyout_source',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit('merge lost required #584/#588 markers: ' + repr(missing))

          path.write_text(text, encoding='utf-8')
          PY

          python -m py_compile main_legacy.py terms_glossary.py report_pdf.py

          # Temporary resolver must not remain in the PR diff.
          git rm .github/workflows/resolve-pr-588.yml
          git add main_legacy.py
          git status --short
          git commit -m 'Merge main after #584 into #588 and preserve both changes'
          git push origin HEAD:claude/terms-glossary
