name: Resolve PR 589 against main

on:
  push:
    branches: [claude/tep-object-parking-sellable]
    paths: [.github/workflows/resolve-pr589.yml]

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: claude/tep-object-parking-sellable
      - name: Merge current main preserving PR 589 parking decision
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          cp tests/golden/CHANGES.md /tmp/pr589-changes.md
          git merge origin/main -X ours --no-edit
          git show origin/main:tests/golden/CHANGES.md > tests/golden/CHANGES.md
          grep 'c0af3ddc1429' /tmp/pr589-changes.md >> tests/golden/CHANGES.md || true
          rm .github/workflows/resolve-pr589.yml
          git add -A
          git commit --amend --no-edit
          git push origin HEAD:claude/tep-object-parking-sellable
