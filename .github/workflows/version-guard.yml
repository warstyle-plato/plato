name: Версия ветки выше main

# Проверка «версия строго растёт» стоит на main и ловит столкновение уже после
# слияния: сборка красная, образа нет, а разбираться идёт тот, кто влил вторым.
# Здесь она же на ветке и против базы — секунды работы вместо двадцати минут
# сборки с Chromium.
#
# С 21.09.2026 роста здесь НЕ требуется. Пока требовался, ветка обязана была
# взять номер заранее и вслепую: соседняя сессия держит свой номер у себя, и
# до её слияния расхождения не видно ниоткуда — так #464 и #465 взяли 0.24.16
# одновременно, каждая законно. Номер выдаёт слияние (workflow «Слияние с
# выдачей номера»), а ветка до него стоит на номере базы. Сторож теперь ловит
# две настоящие беды: номер НИЖЕ базы (выпуск назад) и номер, который уже
# держит соседняя ветка.

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"

concurrency:
  group: version-guard-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Нужны обе стороны сравнения: своя ветка и база.
          fetch-depth: 0
      - name: Номер не ниже базы и не занят соседом
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          python3 scripts/check_version_grows.py --on-branch \
            --base "origin/${{ github.base_ref }}"
