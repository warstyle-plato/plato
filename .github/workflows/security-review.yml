name: Обзор безопасности изменений

# Claude читает diff каждого PR как рецензент по безопасности: ищет путь от
# входа к последствию в самих изменениях и пишет находки комментариями в PR.
# Это дополнение к CodeQL (шаблоны) и аудиту 23.10.2026 (разовый срез):
# CodeQL не видит ошибок доступа вроде открытого маршрута записи, а аудит
# не повторяется на каждой правке.
#
# Нужен секрет CLAUDE_API_KEY (ключ Anthropic, включённый для Claude Code).
# Пока его нет, шаг пропускается и сборка остаётся зелёной: отсутствие
# рецензента — не ошибка в коде. Проверка только комментирует и PR не
# роняет: находка — повод прочитать, а не автоматический вердикт.
#
# Действие читает текст PR как подсказку и не защищено от внедрения
# инструкций; в репозитории PR открывают владелец, Dependabot и сессии Claude.
# Если появятся PR от посторонних — включить в настройках «Require approval
# for all external contributors».

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

concurrency:
  group: security-review-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    name: Claude читает diff
    if: github.event.pull_request.merged == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Есть ли ключ
        id: key
        env:
          HAS_KEY: ${{ secrets.CLAUDE_API_KEY != '' }}
        run: |
          echo "present=${HAS_KEY}" >> "$GITHUB_OUTPUT"
          if [ "${HAS_KEY}" != "true" ]; then
            echo "::notice title=Обзор безопасности пропущен::Секрет CLAUDE_API_KEY не задан — добавьте его в настройках репозитория, и проверка заработает."
          fi
      - uses: actions/checkout@v7
        if: steps.key.outputs.present == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      # В action зашита проверка ключа запросом к claude-3-5-haiku-20241022,
      # которую Anthropic сняла 19.02.2026: каждый прогон давал not_found,
      # и фильтр ложных срабатываний молча выключался. Берём action на
      # закреплённом коммите и меняем модель проверки на действующую; если
      # строка не нашлась — падаем, а не работаем снова без фильтра.
      - name: Action с действующей моделью проверки ключа
        if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          repository: anthropics/claude-code-security-review
          ref: 0c6a49f1fa56a1d472575da86a94dbc1edb78eda
          path: .security-review-action
      - name: Заменить снятую модель
        if: steps.key.outputs.present == 'true'
        run: |
          f=.security-review-action/claudecode/claude_api_client.py
          grep -q 'claude-3-5-haiku-20241022' "$f" || {
            echo "::error title=Обзор безопасности::В action не нашлась строка снятой модели — проверьте $f перед обновлением коммита."
            exit 1
          }
          sed -i 's/claude-3-5-haiku-20241022/claude-haiku-5-5/g' "$f"
          ! grep -rn 'claude-3-5-haiku' .security-review-action/claudecode --include=*.py | grep -v /test
      - uses: ./.security-review-action
        if: steps.key.outputs.present == 'true'
        with:
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
          comment-pr: true
          claude-model: claude-sonnet-5-5
          claudecode-timeout: 20
          # Данные и слепки — не код: искать в них уязвимости нечего, а токенов
          # они стоят.
          exclude-directories: docs,tests/fixtures,reference_data,genplan_assets,presets,data,.security-review-action
