name: Apply cadastral auto TEP fix

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/fix-cadastral-auto-tep'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply patch
        shell: bash
        run: |
          python scripts/fix_cadastral_auto_tep.py
          python -m py_compile main.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add main.py requirements.txt
          git commit -m 'Restore automatic cadastral TEP calculation in Telegram'
          git push origin HEAD:${{ github.head_ref }}
