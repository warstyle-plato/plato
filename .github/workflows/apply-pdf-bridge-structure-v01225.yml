name: Apply PDF bridge structure v0.12.25

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/restore-pdf-bridge-structure-v01225'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply patch and validate PDF
        shell: bash
        run: |
          python scripts/restore_pdf_bridge_structure.py
          python -m py_compile main.py
          python -m pip install -q -r requirements.txt
          python - <<'PY'
          from pathlib import Path
          import main

          code = Path('main.py').read_text(encoding='utf-8')
          assert main.app.version == '0.12.25'
          assert 'Структура расчётного БРИДЖА' in code
          assert 'VRI is deliberately absent' in code

          payload = {
              'result': {
                  'summary': {
                      'revenue': 12_620_000_000,
                      'total_expenses': 11_450_000_000,
                      'ebitda': 3_170_000_000,
                      'net_profit': 1_170_000_000,
                      'margin': 0.093,
                      'llcr': 1.11,
                      'social_payment_mode': 'Денежная компенсация',
                  },
                  'report': {
                      'financing': {
                          'calculated_bridge': 1_400_000_000,
                          'actual_bridge': 1_350_000_000,
                          'pf_uncovered_peak': 2_740_000_000,
                          'pf_limit': 4_000_000_000,
                          'current_key_rate': 0.14,
                          'bridge_spread': 0.06,
                          'current_bridge_rate': 0.20,
                          'avg_bridge_key_rate': 0.12,
                          'avg_bridge_rate': 0.18,
                          'avg_pf_effective_rate': 0.075,
                          'interest_and_fees': 400_000_000,
                      },
                      'products': [],
                      'expense_structure': [],
                      'calendar': {},
                  },
                  'capex': {
                      'social': 580_000_000,
                      'design_p': 60_000_000,
                      'design_rd': 60_000_000,
                  },
                  'tep': {'rows': [], 'total': {}},
                  'finance': {'rows': []},
              },
              'inputs': {
                  'purchase_price_mln': 700,
                  'land_rights_cost_mln': 1270,
                  'project_class': 'comfort',
              },
              'scenario': 'base',
              'cadastral_numbers': ['77:09:0004014:13'],
              'source_label': 'ГлавАПУ',
          }
          pdf = main._build_developaid_pdf(payload)
          assert pdf.startswith(b'%PDF-')
          assert len(pdf) > 5000
          print('PDF_BRIDGE_STRUCTURE_VALIDATED', len(pdf))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f scripts/restore_pdf_bridge_structure.py
          git add -A
          git commit -m 'DevelopAid v0.12.25: restore bridge-purpose structure in PDF'
          git push origin HEAD:${{ github.head_ref }}
