name: Urgent finance correction runner

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'urgent/finance-corrections-v01219'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply urgent finance patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          set +e
          (
            test -f scripts/rename_pf_add_expenses.py
            python scripts/rename_pf_add_expenses.py
            rc=$?; [ "$rc" -eq 0 ] || exit "$rc"
            python -m py_compile main.py
            rc=$?; [ "$rc" -eq 0 ] || exit "$rc"
            python - <<'PY'
          from pathlib import Path
          c=Path('main.py').read_text(encoding='utf-8')
          assert 'version="0.12.19"' in c
          assert 'debt_capex[project_start] = max' not in c
          assert 'cash_revenue_to_equity' in c
          assert 'peak_uncovered_pf' in c
          assert 'Пиковая (непокрытая эскроу) задолженность ПФ' in c
          assert 'расходы всего' in c
          print('URGENT_FINANCE_VALIDATED')
          PY
          ) > /tmp/urgent-finance.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            git fetch origin urgent/finance-corrections-v01219
            git checkout -B urgent/finance-corrections-v01219 origin/urgent/finance-corrections-v01219
            cp /tmp/urgent-finance.log .github/urgent-finance-error.txt
            git add .github/urgent-finance-error.txt
            git commit -m 'Capture urgent finance patch error' || true
            git push origin HEAD:urgent/finance-corrections-v01219 || true
            cat /tmp/urgent-finance.log
            exit "$rc"
          fi
          rm -f scripts/rename_pf_add_expenses.py
          rm -f .github/workflows/urgent-finance-pr.yml
          rm -f .github/workflows/apply-pf-expenses-on-reopen.yml
          rm -f .github/workflows/apply-pf-expenses-main.yml
          rm -f .github/workflows/apply-pf-expenses-fix.yml
          rm -f .github/workflows/apply-pf-expenses-on-comment.yml
          git add -A
          git commit -m 'DevelopAid v0.12.19: urgent finance corrections'
          git push origin HEAD:main
