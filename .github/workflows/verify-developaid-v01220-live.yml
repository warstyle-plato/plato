name: Verify DevelopAid v0.12.20 live

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

jobs:
  verify:
    if: github.head_ref == 'verify/developaid-v01220-live'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for live v0.12.20
        shell: bash
        run: |
          python - <<'PY'
          import json, time, urllib.request
          url='https://plato-development-investment-model.onrender.com/telegram/status'
          last=''
          for i in range(60):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'DevelopAid-live-verifier/0.12.20'})
                  with urllib.request.urlopen(req,timeout=30) as r:
                      last=r.read().decode('utf-8','replace')
                  print(f'attempt {i+1}: {last}',flush=True)
                  data=json.loads(last)
                  if data.get('version')=='0.12.20' and data.get('enabled') and data.get('configured'):
                      print('LIVE_V01220_OK',flush=True)
                      raise SystemExit(0)
              except Exception as e:
                  print(f'attempt {i+1} error: {e!r}',flush=True)
              time.sleep(10)
          raise SystemExit('Live v0.12.20 not confirmed; last='+last)
          PY
