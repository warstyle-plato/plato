name: Apply Telegram TEP template v2

on:
  push:
    branches:
      - v0.12.27-telegram-tep-template-v3
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refine patch anchor
        run: python .github/patches/fix_manual_session_anchor.py

      - name: Apply integration patch
        run: |
          if ! python .github/patches/apply_telegram_tep_template_v2.py > patch-output.txt 2>&1; then
            mv patch-output.txt .github/patches/telegram-template-patch-error.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .github/patches/telegram-template-patch-error.txt
            git commit -m 'Record Telegram template patch error'
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
            exit 1
          fi

      - name: Check Python syntax
        run: python -m py_compile main.py

      - name: Install application dependencies
        run: pip install -r requirements.txt

      - name: Parse the new workbook through DevelopAid
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          import main

          path = Path('templates/DevelopAid_Шаблон_ТЭП.xlsx.b64')
          payload = base64.b64decode(path.read_text(encoding='ascii'), validate=True)
          parsed = main.parse_manual_tep_xlsx(payload, 'DevelopAid_Шаблон_ТЭП.xlsx')
          assert parsed['source']['template_version'] == 'DevelopAid_TEP_2'
          assert parsed['source']['sheet'] == 'ТЭП DevelopAid'
          assert 'region' in parsed
          assert set(parsed['tep']) == set(main.TEP_DEFAULT)
          print('Template parser smoke test passed')
          PY

      - name: Remove one-shot integration files
        run: |
          rm .github/patches/apply_telegram_tep_template_v2.py
          rm .github/patches/fix_manual_session_anchor.py
          rm .github/workflows/apply-telegram-tep-template-v2.yml
          rm -f patch-output.txt .github/patches/telegram-template-patch-error.txt
          rm -f .github/patches/tep_template_v2.part*
          rm -f templates/DevelopAid_Шаблон_ТЭП.xlsx

      - name: Commit integrated change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'DevelopAid v0.12.27: Telegram TEP Excel template v2'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
