name: Apply Telegram TEP template v2

on:
  push:
    branches:
      - v0.12.27-telegram-tep-template-v3
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refine patch anchor
        run: python .github/patches/fix_manual_session_anchor.py

      - name: Apply integration patch
        run: |
          if ! python .github/patches/apply_telegram_tep_template_v2.py > patch-output.txt 2>&1; then
            mv patch-output.txt .github/patches/telegram-template-patch-error.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .github/patches/telegram-template-patch-error.txt
            git commit -m 'Record Telegram template patch error'
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
            exit 1
          fi

      - name: Check Python syntax
        run: python -m py_compile main.py

      - name: Install test dependencies
        run: pip install -r requirements.txt openpyxl

      - name: Parse a filled workbook through DevelopAid
        run: |
          python - <<'PY'
          import base64
          from io import BytesIO
          from pathlib import Path
          from openpyxl import load_workbook
          import main

          encoded_path = Path('templates/DevelopAid_Шаблон_ТЭП.xlsx.b64')
          payload = base64.b64decode(encoded_path.read_text(encoding='ascii'), validate=True)

          workbook = load_workbook(BytesIO(payload))
          sheet = workbook['ТЭП DevelopAid']
          sheet['B5'] = 'Тестовый проект'
          sheet['B6'] = 'Московская область, Мытищи'
          sheet['B7'] = 1.5
          sheet['C13'] = 10000
          sheet['D13'] = 9000
          sheet['E13'] = 8000
          sheet['F13'] = 8000
          sheet['H13'] = 120
          sheet['C18'] = 7000
          sheet['H18'] = 200
          sheet['C20'] = 1200
          sheet['D20'] = 1200
          sheet['G20'] = 1200
          sheet['H20'] = 100
          filled = BytesIO()
          workbook.save(filled)

          parsed = main.parse_manual_tep_xlsx(
              filled.getvalue(),
              'DevelopAid_Шаблон_ТЭП.xlsx',
          )
          assert parsed['source']['template_version'] == 'DevelopAid_TEP_2'
          assert parsed['source']['sheet'] == 'ТЭП DevelopAid'
          assert parsed['region'] == 'Московская область, Мытищи'
          assert parsed['summary']['apartment_saleable_sqm'] == 8000
          assert parsed['summary']['parking_spaces'] == 200
          assert set(parsed['tep']) == set(main.TEP_DEFAULT)
          print('Filled template parser smoke test passed')
          PY

      - name: Remove one-shot integration files
        run: |
          rm .github/patches/apply_telegram_tep_template_v2.py
          rm .github/patches/fix_manual_session_anchor.py
          rm .github/workflows/apply-telegram-tep-template-v2.yml
          rm -f patch-output.txt .github/patches/telegram-template-patch-error.txt
          rm -f .github/patches/tep_template_v2.part*
          rm -f templates/DevelopAid_Шаблон_ТЭП.xlsx

      - name: Commit integrated change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'DevelopAid v0.12.27: Telegram TEP Excel template v2'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
