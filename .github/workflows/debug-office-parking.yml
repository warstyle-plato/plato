name: Debug office parking phased saleable

on:
  push:
    branches: [fix/office-parking-phased-saleable]

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Extract relevant source
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path("main_legacy.py")
          src=p.read_text(encoding="utf-8")
          lines=src.splitlines()
          tree=ast.parse(src)
          wanted={"apply_object_parking","_calculate_phased_once","calculate","build_project_workbook"}
          chunks=[]
          for node in tree.body:
              if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)) and node.name in wanted:
                  a=node.lineno; b=getattr(node,"end_lineno",node.lineno)
                  chunks.append(f"\n### {node.name} {a}-{b}\n" + "\n".join(lines[a-1:b]))
          needles=[
              "offices_saleable_sqm","parking_saleable_taken","object_saleable(",
              "parking_over_units","object_parking_over_area_per_space_sqm",
              "build_project_workbook","КОНСОЛИДАТОР","revenue_by_product"
          ]
          chunks.append("\n### CONTEXT MATCHES\n")
          for i,line in enumerate(lines,1):
              if any(n in line for n in needles):
                  lo=max(1,i-5); hi=min(len(lines),i+8)
                  chunks.append(f"\n--- {lo}-{hi} around {i} ---\n" + "\n".join(lines[lo-1:hi]))
          Path("debug_office_parking.txt").write_text("\n".join(chunks),encoding="utf-8")
          PY
      - name: Commit extract
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add debug_office_parking.txt
          git commit -m "Debug office parking phased source" || exit 0
          git push
