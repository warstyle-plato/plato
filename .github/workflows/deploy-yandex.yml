name: Выкатка в Yandex Cloud

# Собирать образ на самом ядре стало гаданием, какой канал отвалился сегодня:
# с той машины закрыты *.onrender.com и api.telegram.org, а pypi.org рвёт
# соединение и на рукопожатии («SSL: UNEXPECTED_EOF»), и на чтении («Read timed
# out»). Зеркала лечат симптом — сборке нужен открытый интернет, которого у
# машины нет.
#
# Здесь интернет открыт весь. Образ собирается тут, ложится в Yandex Container
# Registry — он в том же ru-central1, между ним и ядром блокировать нечего, —
# и машина только скачивает готовое. Ни pip, ни Playwright на проде.
#
# Порядок жёсткий: тесты → сборка → публикация → выкатка. Красный шаг
# останавливает цепочку, и прод продолжает работать на прежнем образе.

on:
  push:
    branches: [main]
    # Workflow- и документационные изменения сами по себе не меняют приложение
    # и не должны запускать двадцатиминутную production-выкладку.
    paths-ignore:
      - ".github/**"
      - "docs/**"
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Пропустить тесты (только для срочного отката)"
        type: boolean
        default: false

concurrency:
  # Две выкатки разом оставили бы прод в неизвестном состоянии.
  group: deploy-yandex
  cancel-in-progress: false

env:
  IMAGE_NAME: developaid

jobs:
  test:
    name: Тесты
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ !inputs.skip_tests }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install pytest
      # Полный набор идёт около девятнадцати минут — это дешевле, чем
      # выяснять на проде. Останавливаемся на первой поломке: дальше смысла нет.
      - name: Полный набор
        run: python -m pytest tests -q -x

  build:
    name: Сборка и публикация
    runs-on: ubuntu-latest
    needs: [test]
    # Тесты пропущены только при срочном откате — тогда джоб test не запускался
    # вовсе, и обычное needs завалило бы сборку.
    if: ${{ always() && (needs.test.result == 'success' || inputs.skip_tests) }}
    timeout-minutes: 60
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    permissions:
      contents: read
      id-token: write   # для обмена OIDC-токена на IAM-токен Yandex Cloud
    steps:
      - uses: actions/checkout@v4

      - name: Теги образа
        id: meta
        run: |
          sha=$(git rev-parse --short=7 HEAD)
          version=$(grep -m1 '^VERSION = ' main_legacy.py | cut -d'"' -f2)
          [ -n "$version" ] || { echo "VERSION не найдена в main_legacy.py" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Коммит $sha, версия $version"

      # Постоянный административный ключ в репозитории — это ключ, который
      # нельзя отозвать, не заметив утечки. OIDC выдаёт токен на время одного
      # запуска. Статический ключ остаётся запасным путём: если федерация не
      # заведена, секрет YC_SA_KEY подставится ниже.
      - name: IAM-токен по OIDC
        id: oidc
        if: ${{ vars.YC_WORKLOAD_FEDERATION_ID != '' }}
        uses: yc-actions/yc-iam-token-fed@v1
        with:
          yc-sa-id: ${{ vars.YC_SA_ID }}
          yc-federation-id: ${{ vars.YC_WORKLOAD_FEDERATION_ID }}

      - name: Вход в реестр
        run: |
          if [ -n "${{ steps.oidc.outputs.token }}" ]; then
            echo "${{ steps.oidc.outputs.token }}" \
              | docker login --username iam --password-stdin cr.yandex
          elif [ -n "${{ secrets.YC_SA_KEY }}" ]; then
            echo "Федерация не настроена — вход по ключу сервисного аккаунта."
            printf '%s' '${{ secrets.YC_SA_KEY }}' \
              | docker login --username json_key --password-stdin cr.yandex
          else
            echo "Нет ни федерации (vars.YC_WORKLOAD_FEDERATION_ID), ни ключа (secrets.YC_SA_KEY)." >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Сборка и публикация
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GIT_COMMIT=${{ steps.meta.outputs.sha }}
          # Тег по коммиту — то, чем выкатка адресует конкретный образ; prod —
          # указатель на то, что сейчас должно крутиться. Одного latest мало:
          # по нему не откатиться и не понять, что именно подняли.
          tags: |
            cr.yandex/${{ secrets.YC_REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha }}
            cr.yandex/${{ secrets.YC_REGISTRY_ID }}/${{ env.IMAGE_NAME }}:prod
            cr.yandex/${{ secrets.YC_REGISTRY_ID }}/${{ env.IMAGE_NAME }}:v${{ steps.meta.outputs.version }}
          # Без кэша каждая сборка ставит Chromium заново, и двадцать минут
          # возвращаются — теперь уже сюда.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Выкатка на ядро
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 20
    steps:
      - name: Запуск выкатки по SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CORE_HOST }}
          username: ${{ secrets.CORE_USER }}
          key: ${{ secrets.CORE_SSH_KEY }}
          # Скрипт живёт в репозитории и обновляется git pull — иначе выкатка
          # чинилась бы правкой файла на машине, то есть вне истории.
          script: |
            set -eu
            cd ~/plato
            git fetch --quiet origin main
            git checkout --quiet -B main origin/main
            sh deploy-developaid.sh ${{ needs.build.outputs.sha }}

      - name: Что выкачено
        run: |
          echo "Коммит ${{ needs.build.outputs.sha }} поднят на ядре."
          echo "Проверка: curl -s https://developaid.ru/health"
