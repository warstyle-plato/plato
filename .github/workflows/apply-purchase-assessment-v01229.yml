name: Apply DevelopAid purchase assessment

on:
  push:
    branches:
      - v0.12.29-app-purchase-assessment
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply integration patch
        run: python .github/patches/apply_purchase_assessment_v01229.py

      - name: Check Python syntax
        run: python -m py_compile main.py

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test template, API and app integration
        run: |
          if ! python .github/patches/smoke_purchase_assessment_v01229.py > smoke-output.txt 2>&1; then
            mv smoke-output.txt .github/patches/purchase-assessment-smoke-error.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .github/patches/purchase-assessment-smoke-error.txt
            git commit -m 'Record purchase assessment smoke-test error'
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
            exit 1
          fi

      - name: Check browser JavaScript syntax
        run: node --check /tmp/developaid-page.js

      - name: Remove one-shot files
        run: |
          rm .github/patches/apply_purchase_assessment_v01229.py
          rm .github/patches/smoke_purchase_assessment_v01229.py
          rm .github/workflows/apply-purchase-assessment-v01229.yml
          rm -f smoke-output.txt .github/patches/purchase-assessment-smoke-error.txt
          rm -rf __pycache__

      - name: Commit integrated change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'DevelopAid v0.12.29: in-app purchase feasibility and price ceiling'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
