name: Apply DevelopAid purchase assessment

on:
  push:
    branches:
      - v0.12.29-app-purchase-assessment
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply integration patch
        run: python .github/patches/apply_purchase_assessment_v01229.py

      - name: Check Python syntax
        run: python -m py_compile main.py

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test template, API and app integration
        run: |
          python - <<'PY'
          import base64
          import copy
          import re
          from pathlib import Path
          import main

          payload = base64.b64decode(Path('templates/DevelopAid_Шаблон_ТЭП.xlsx.b64').read_text(encoding='ascii'), validate=True)
          tables = main._xlsx_read_tables(payload)
          assert main._find_parameter(tables['ТЭП DevelopAid'], 'Версия шаблона') == 'DevelopAid_TEP_3'
          instruction = ' '.join(str(cell or '') for row in tables['Инструкция'] for cell in row)
          assert 'Платона Сергеевича' in instruction
          assert 'инвестиционную оценку' in instruction.lower()

          inputs = copy.deepcopy(main.DEFAULT_INPUTS)
          inputs.update({
              'purchase_price_mln': 0,
              'apartment_price_th': 650,
              'commercial_price_th': 650,
              'parking_price_th': 5000,
              'main_above_th_per_sqm': 110,
              'main_under_th_per_sqm': 110,
          })
          result = main.purchase_assessment_api(main.PurchaseAssessmentRequest(
              inputs=inputs,
              tep=copy.deepcopy(main.TEP_DEFAULT),
              rates=[],
              phasing={},
              target_llcr=1.20,
              target_npv_mln=0,
          ))
          assert result['status'] in {'ceiling_calculated', 'not_feasible'}, result
          if result.get('available'):
              assert result['max_purchase_price_mln'] >= 0
              assert result['max_purchase_price_mln'] <= min(result['llcr_ceiling_mln'], result['npv_ceiling_mln']) + 0.02

          assert main.app.version == '0.12.29'
          assert 'purchaseAssessmentCard' in main.PAGE
          assert '/investment/purchase-assessment' in main.PAGE
          assert main.PAGE.count('await runPurchaseAssessment(true);') >= 2
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', main.PAGE, flags=re.S)
          Path('/tmp/developaid-page.js').write_text('\n'.join(scripts), encoding='utf-8')
          print('Purchase assessment integration test passed')
          PY

      - name: Check browser JavaScript syntax
        run: node --check /tmp/developaid-page.js

      - name: Remove one-shot files
        run: |
          rm .github/patches/apply_purchase_assessment_v01229.py
          rm .github/workflows/apply-purchase-assessment-v01229.yml
          rm -rf __pycache__

      - name: Commit integrated change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'DevelopAid v0.12.29: in-app purchase feasibility and price ceiling'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
