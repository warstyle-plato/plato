name: Validate minimal cadastral pricing flow

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

jobs:
  validate:
    if: github.head_ref == 'agent/minimal-cadastral-pricing-smr'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Install runtime dependencies
        run: python -m pip install -q -r requirements.txt
      - name: Validate Python, session overrides, parser and embedded JS
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: '123456:test-token-for-validation'
        run: |
          python -m py_compile main.py
          python - <<'PY'
          import re
          from pathlib import Path
          import main

          assert main.app.version == '0.12.16', main.app.version
          assert main._telegram_econ_value_th('420') == 420
          assert main._telegram_econ_value_th('2,5 млн') == 2500

          overrides = {
              'project_class': 'business',
              'apartment_price_th': 650,
              'commercial_price_th': 650,
              'parking_price_th': 5000,
              'smr_th_per_sqm': 145,
          }
          token = main._telegram_session(123, ['77:09:0004014:13'], calc_overrides=overrides)
          payload = main._telegram_verify_session(token)
          assert payload['cad'] == ['77:09:0004014:13']
          assert payload['calc_overrides'] == overrides

          code = Path('main.py').read_text(encoding='utf-8')
          assert 'async function obtainCadastralTep()' in code
          assert "fetch('/cadastral/tep-from-calculator'" in code
          assert 'pyppeteer' not in code
          assert 'inputs.main_above_th_per_sqm=smr;' in code
          assert 'inputs.landscaping_th_per_sqm=0;' in code
          assert 'inputs.reserve_pct=0;' in code
          assert 'window.Telegram.WebApp&&telegramResultSent' in code

          page = main.PAGE
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', page, flags=re.S | re.I)
          assert scripts, 'No inline script found in PAGE'
          Path('/tmp/developaid-inline.js').write_text(scripts[-1], encoding='utf-8')
          print('RUNTIME_VALIDATION_OK', main.app.version)
          PY
          node --check /tmp/developaid-inline.js
