name: DevelopAid v0.12.30 hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/developaid-v01230-hotfix.yml'

permissions:
  contents: write

jobs:
  patch-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Telegram help and Mini App close flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('main.py')
          text = path.read_text(encoding='utf-8')
          original = text

          version_count = text.count('0.12.29')
          if version_count < 2:
              raise SystemExit(f'Expected at least 2 version markers, found {version_count}')
          text = text.replace('0.12.29', '0.12.30')

          handler_marker = 'def _telegram_handle_message(message: dict[str, Any]) -> None:\n'
          if handler_marker not in text:
              raise SystemExit('Telegram message handler marker not found')

          help_function = '''def _telegram_send_help(chat_id: int) -> None:
              _telegram_send_message(
                  chat_id,
                  "<b>Как работать с DevelopAid</b>\\n\\n"
                  "<b>1. Создайте исходный ТЭП</b>\\n"
                  "• для московского участка — отправьте один или несколько кадастровых номеров;\\n"
                  "• для проекта в другом регионе или без кадастра — ответьте на вопросы бота;\\n"
                  "• либо скачайте Excel-шаблон, заполните известные параметры и отправьте файл обратно в чат.\\n\\n"
                  "Кадастровый автоматический расчёт использует нормативный калькулятор Москвы. Для других регионов ТЭП, градостроительные платежи и локальные нормативы необходимо вводить или уточнять вручную.\\n\\n"
                  "<b>2. Проверьте проект в мини-приложении</b>\\n"
                  "После загрузки ТЭП можно изменить состав и площади продуктов, цены и темпы продаж, себестоимость, сроки ИРД и строительства, прогноз ключевой ставки, условия БРИДЖа и проектного финансирования.\\n\\n"
                  "Для крупного проекта можно включить очередность, распределить квартиры, коммерцию, паркинг, общепроектные расходы и социальные объекты между очередями, а также настроить строительство или денежную компенсацию социальной нагрузки.\\n\\n"
                  "<b>3. Получите инвестиционный вывод</b>\\n"
                  "DevelopAid считает выручку, CAPEX, EBITDA, чистую прибыль, NPV, LLCR, потребность в БРИДЖе и ПФ, динамику долга и эскроу. Блок «Инвестиционная оценка» показывает предварительную целесообразность покупки и допустимую цену входа по текущим предпосылкам.\\n\\n"
                  "<b>4. Задайте вопрос Платону Сергеевичу Федоскину</b>\\n"
                  "Встроенный AI-консультант работает с текущей моделью. Ему можно написать обычным языком: «почему такой LLCR», «за сколько максимум можно купить», «какая цена продаж нужна», «что будет при росте СМР» или «подбери параметры проекта».\\n\\n"
                  "Платон Сергеевич может выполнить сценарный пересчёт и подготовить изменения вводных. Самостоятельно модель он не меняет: новые параметры применяются только после подтверждения кнопкой «Применить в модель».\\n\\n"
                  "<b>5. Сформируйте результат</b>\\n"
                  "В приложении доступны сводный отчёт, сравнение очередей, календарный план и PDF с ключевыми графиками.\\n\\n"
                  "<i>Расчёт является предварительной инвестиционной моделью, а не отчётом оценщика и не решением банка. Доплата по коэффициенту Д пока автоматически не прогнозируется.</i>",
                  reply_markup={"inline_keyboard": [
                      [{"text": "Расчёт по кадастровым номерам", "callback_data": "flow_cad_yes"}],
                      [{"text": "Собрать ТЭП без кадастра", "callback_data": "flow_cad_no"}],
                      [{"text": "Открыть мини-приложение DevelopAid", "web_app": {"url": _telegram_web_app_url(chat_id, [])}}],
                  ]},
              )


          '''
          text = text.replace(handler_marker, help_function + handler_marker, 1)

          old_commands = '''    if command in {"/start", "/help", "/menu"}:
                  _telegram_start_message(chat_id, user_id)
                  return
          '''
          new_commands = '''    if command in {"/start", "/menu"}:
                  _telegram_start_message(chat_id, user_id)
                  return
              if command == "/help":
                  if not _telegram_user_allowed(user_id):
                      _telegram_start_message(chat_id, user_id)
                  else:
                      _telegram_send_help(chat_id)
                  return
          '''
          if old_commands not in text:
              raise SystemExit('Old /start-/help command block not found')
          text = text.replace(old_commands, new_commands, 1)

          old_callback = '''        if data == "show_help":
                      _telegram_send_message(
                          chat_id,
                          "<b>Что умеет DevelopAid</b>\\n\\n"
                          "• рассчитывает ТЭП по кадастровым номерам и принимает ручной ТЭП;\\n"
                          "• моделирует продажи, затраты, налоги, БРИДЖ, ПФ и эскроу;\\n"
                          "• позволяет настраивать прогноз ключевой ставки и сценарии;\\n"
                          "• считает одноочередные и многоочередные проекты;\\n"
                          "• распределяет общепроектные расходы и социальную нагрузку по очередям;\\n"
                          "• формирует PDF-отчёт с графиками и календарным Gantt.\\n\\n"
                          "Для детальной настройки откройте мини-приложение DevelopAid.",
                          reply_markup={"inline_keyboard": [[{
                              "text": "Открыть мини-приложение DevelopAid",
                              "web_app": {"url": _telegram_web_app_url(chat_id, [])},
                          }]]},
                      )
                      return
          '''
          new_callback = '''        if data == "show_help":
                      _telegram_send_help(chat_id)
                      return
          '''
          if old_callback not in text:
              raise SystemExit('Old show_help callback block not found')
          text = text.replace(old_callback, new_callback, 1)

          welcome_marker = '''        "DevelopAid рассчитает экономику, потребность в финансировании, динамику долга и эскроу, прибыль, "
                  "маржинальность и LLCR, а также сформирует PDF-отчёт с графиками и календарным планом.\\n\\n"
          '''
          welcome_replacement = '''        "DevelopAid рассчитает экономику, потребность в финансировании, динамику долга и эскроу, прибыль, "
                  "маржинальность и LLCR, а также сформирует PDF-отчёт с графиками и календарным планом.\\n\\n"
                  "В мини-приложении Платон Сергеевич Федоскин может ответить на вопросы по текущей модели, "
                  "подобрать цену покупки и другие параметры, а затем предложить изменения для вашего подтверждения.\\n\\n"
          '''
          if welcome_marker not in text:
              raise SystemExit('Welcome text marker not found')
          text = text.replace(welcome_marker, welcome_replacement, 1)

          send_marker = 'async function sendTelegramResult(){\n'
          if send_marker not in text:
              raise SystemExit('sendTelegramResult marker not found')
          close_helper = '''function closeTelegramWebAppAfterResult(){
           const tg=window.Telegram&&window.Telegram.WebApp;
           if(!tg||telegramMode==='edit')return false;
           try{if(typeof tg.disableClosingConfirmation==='function')tg.disableClosingConfirmation()}catch(e){}
           try{if(tg.MainButton)tg.MainButton.hide()}catch(e){}
           try{if(tg.BackButton)tg.BackButton.hide()}catch(e){}
           const closeNow=()=>{try{tg.close()}catch(e){}};
           setTimeout(closeNow,300);
           setTimeout(closeNow,1100);
           return true;
          }

          '''
          text = text.replace(send_marker, close_helper + send_marker, 1)

          success_marker = '''    if(window.Telegram&&window.Telegram.WebApp){
                    window.Telegram.WebApp.ready();
                    if(window.Telegram.WebApp.HapticFeedback)window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
                  }
          '''
          success_replacement = '''    if(window.Telegram&&window.Telegram.WebApp){
                    window.Telegram.WebApp.ready();
                    if(window.Telegram.WebApp.HapticFeedback)window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
                    closeTelegramWebAppAfterResult();
                  }
          '''
          if success_marker not in text:
              raise SystemExit('Telegram result success block not found')
          text = text.replace(success_marker, success_replacement, 1)

          old_cad_close = '''    if(window.Telegram&&window.Telegram.WebApp&&telegramResultSent){
                     setTimeout(()=>window.Telegram.WebApp.close(),700);
                    }
          '''
          new_cad_close = '''    if(telegramResultSent)closeTelegramWebAppAfterResult();
          '''
          if old_cad_close not in text:
              raise SystemExit('Old cadastral close block not found')
          text = text.replace(old_cad_close, new_cad_close, 1)

          if text == original:
              raise SystemExit('No changes produced')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate Python and embedded JavaScript markers
        shell: bash
        run: |
          python -m py_compile main.py
          python - <<'PY'
          from pathlib import Path
          text = Path('main.py').read_text(encoding='utf-8')
          required = [
              'def _telegram_send_help',
              'if command == "/help"',
              'function closeTelegramWebAppAfterResult()',
              'closeTelegramWebAppAfterResult();',
              'version="0.12.30"',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit('Missing markers: ' + ', '.join(missing))
          print('Hotfix markers validated')
          PY
      - name: Commit patched main.py
        shell: bash
        run: |
          git config user.name 'DevelopAid Automation'
          git config user.email 'developaid-bot@users.noreply.github.com'
          git add main.py
          if git diff --cached --quiet; then
            echo 'main.py already patched'
            exit 0
          fi
          git commit -m 'DevelopAid v0.12.30: bot instruction and Mini App close'
          git push origin HEAD:main
