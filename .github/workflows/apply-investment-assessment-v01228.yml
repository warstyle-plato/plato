name: Apply DevelopAid investment assessment

on:
  push:
    branches:
      - v0.12.28-investment-assessment
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Align patch anchors with current main.py
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/patches/apply_investment_assessment_v01228.py')
          text = path.read_text(encoding='utf-8')
          health = '''text = replace_once(
              text,
              'def health(): return {"status":"ok","version":"0.12.25"}',
              'def health(): return {"status":"ok","version":"0.12.28"}',
              'health version',
          )
          '''
          if health not in text:
              raise SystemExit('obsolete health block not found')
          text = text.replace(health, '', 1)
          old_caption = '''    '                "Бот проверит файл и покажет сводку перед открытием модели."',
          '''
          new_caption = '''    '            "Бот проверит структуру, покажет сводку и предложит открыть проект в DevelopAid."',
          '''
          if old_caption not in text:
              raise SystemExit('old template caption anchor not found')
          text = text.replace(old_caption, new_caption, 1)
          start_marker = "text = replace_once(\n    text,\n    '''  inputs._manual_tep_import={"
          end_marker = "\n\n# UI styles."
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('optional manual region block not found')
          text = text[:start] + text[end:]

          auto_start = text.find('# Automatic assessment after imported TEP')
          auto_end = text.find('MAIN.write_text', auto_start)
          if auto_start < 0 or auto_end < 0:
              raise SystemExit('automatic assessment tail not found')
          new_tail = r"""# Automatic assessment after imported TEP is applied (ГлавАПУ and Telegram/manual).
          def insert_assessment_before_telegram_send(source: str, function_marker: str) -> str:
              start = source.find(function_marker)
              if start < 0:
                  raise RuntimeError(f'function not found: {function_marker}')
              end = source.find("\n}\n", start)
              if end < 0:
                  raise RuntimeError(f'function end not found: {function_marker}')
              send = source.find('await sendTelegramResult();', start, end)
              if send < 0:
                  raise RuntimeError(f'Telegram send not found: {function_marker}')
              line_start = source.rfind("\n", start, send) + 1
              indent = source[line_start:send]
              if 'await runInvestmentAssessment(true);' in source[start:end]:
                  return source
              return source[:line_start] + indent + 'await runInvestmentAssessment(true);\n' + source[line_start:]

          text = insert_assessment_before_telegram_send(text, 'async function applyTelegramManualTep(manual){')
          text = insert_assessment_before_telegram_send(text, 'async function applyGlavapu(){')

          # Reopen assessment for locally stored imported projects after initial model calculation.
          init_start = text.find('async function initializeApp(){')
          init_end = text.find("\n}\n", init_start)
          launch = text.find('await initializeTelegramLaunch();', init_start, init_end)
          if init_start < 0 or init_end < 0 or launch < 0:
              raise RuntimeError('initializeApp launch anchor not found')
          launch_line_start = text.rfind("\n", init_start, launch) + 1
          launch_line_end = text.find("\n", launch)
          launch_indent = text[launch_line_start:launch]
          restore_line = launch_indent + 'if((inputs._glavapu_import||inputs._manual_tep_import)&&!lastInvestmentAssessment)await runInvestmentAssessment(true);\n'
          if 'lastInvestmentAssessment)await runInvestmentAssessment(true);' not in text[init_start:init_end]:
              text = text[:launch_line_end + 1] + restore_line + text[launch_line_end + 1:]

          """
          text = text[:auto_start] + new_tail + text[auto_end:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply deterministic integration patch
        run: |
          if ! python .github/patches/apply_investment_assessment_v01228.py > patch-output.txt 2>&1; then
            mv patch-output.txt .github/patches/investment-assessment-patch-error.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .github/patches/investment-assessment-patch-error.txt
            git commit -m 'Record investment assessment patch error'
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
            exit 1
          fi

      - name: Check Python syntax
        run: python -m py_compile main.py

      - name: Install application dependencies
        run: pip install -r requirements.txt

      - name: Smoke-test template and investment assessment
        run: |
          python - <<'PY'
          import base64
          import copy
          from pathlib import Path
          import main

          payload = base64.b64decode(
              Path('templates/DevelopAid_Шаблон_ТЭП.xlsx.b64').read_text(encoding='ascii'),
              validate=True,
          )
          tables = main._xlsx_read_tables(payload)
          rows = tables['ТЭП DevelopAid']
          assert main._find_parameter(rows, 'Версия шаблона') == 'DevelopAid_TEP_3'
          instruction_text = ' '.join(str(cell or '') for row in tables['Инструкция'] for cell in row)
          assert 'Платона Сергеевича' in instruction_text
          assert 'инвестиционную оценку' in instruction_text.lower()

          inputs = copy.deepcopy(main.DEFAULT_INPUTS)
          inputs.update({
              'purchase_price_mln': 0,
              'apartment_price_th': 650,
              'commercial_price_th': 650,
              'parking_price_th': 5000,
              'main_above_th_per_sqm': 110,
              'main_under_th_per_sqm': 110,
          })
          result = main.investment_assessment_api(main.InvestmentAssessmentRequest(
              inputs=inputs,
              tep=copy.deepcopy(main.TEP_DEFAULT),
              rates=[],
              phasing={},
              target_llcr=1.20,
              target_npv_mln=0,
          ))
          assert result['status'] in {'ceiling_calculated', 'not_feasible'}
          assert 'llcr_ceiling' in result and 'npv_ceiling' in result
          if result.get('available'):
              assert result['max_purchase_price_mln'] >= 0
              assert result['max_purchase_price_mln'] <= min(result['llcr_ceiling_mln'], result['npv_ceiling_mln']) + 0.02

          page = main.PAGE
          assert 'investmentAssessmentCard' in page
          assert 'runInvestmentAssessment' in page
          assert '/investment/assessment' in page
          assert main.app.version == '0.12.28'
          print('Template and investment assessment smoke tests passed')
          PY

      - name: Remove one-shot integration files
        run: |
          rm .github/patches/apply_investment_assessment_v01228.py
          rm .github/workflows/apply-investment-assessment-v01228.yml
          rm -f patch-output.txt .github/patches/investment-assessment-patch-error.txt
          rm -rf __pycache__

      - name: Commit integrated change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'DevelopAid v0.12.28: automatic purchase feasibility and price ceiling'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
