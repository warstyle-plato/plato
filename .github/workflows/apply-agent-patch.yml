name: Apply agent patch

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: startsWith(github.head_ref, 'agent/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply patch
        shell: bash
        run: |
          if [ ! -f scripts/agent_patch.py ]; then
            echo 'No scripts/agent_patch.py found; nothing to do.'
            exit 0
          fi
          python scripts/agent_patch.py
          python -m py_compile main.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f scripts/agent_patch.py
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git commit -m 'Apply DevelopAid bot patch'
          git push origin HEAD:${{ github.head_ref }}
