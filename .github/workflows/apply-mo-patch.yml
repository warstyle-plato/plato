name: Apply MO patch

on:
  push:
    branches: ["agent/mo-calculator-01242"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble staged package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mo_patch
          mapfile -t parts < <(find .developaid/mo_patch_01242 -maxdepth 1 -type f -name '*.b64' | sort -V)
          printf 'Found %s staged chunks\n' "${#parts[@]}"
          printf '%s\n' "${parts[@]}"
          if [ "${#parts[@]}" -lt 2 ]; then
            echo 'Not enough patch chunks' >&2
            exit 1
          fi
          cat "${parts[@]}" | tr -d '\r\n' | base64 -d > /tmp/mo_patch/package.zip
          file /tmp/mo_patch/package.zip
          unzip -t /tmp/mo_patch/package.zip
          unzip -o /tmp/mo_patch/package.zip -d /tmp/mo_patch/unpacked
          find /tmp/mo_patch/unpacked -maxdepth 3 -type f -print
      - name: Apply package
        shell: bash
        run: |
          set -euo pipefail
          cp -a /tmp/mo_patch/unpacked/. ./
          python -m compileall -q .
      - name: Commit applied version
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DevelopAid Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes after applying package'
            exit 0
          fi
          git commit -m 'Apply MO calculator 0.12.42'
          git push
