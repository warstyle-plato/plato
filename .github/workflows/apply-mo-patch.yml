name: Recover and apply MO patch

on:
  push:
    branches: ["agent/mo-calculator-01242"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover complete files from surviving ZIP prefix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mo_patch/unpacked
          cat .developaid/mo_patch_01242/part_aa.b64 \
              .developaid/mo_patch_01242/part_ab.b64 \
            | tr -d '\r\n' \
            | base64 -d > /tmp/mo_patch/package-prefix.zip

          python - <<'PY'
          from __future__ import annotations

          import pathlib
          import struct
          import zlib

          source = pathlib.Path('/tmp/mo_patch/package-prefix.zip').read_bytes()
          target = pathlib.Path('/tmp/mo_patch/unpacked')
          offset = 0
          extracted = []

          while offset + 30 <= len(source):
              signature = source[offset:offset + 4]
              if signature != b'PK\x03\x04':
                  break

              (
                  _signature,
                  _version,
                  flags,
                  compression,
                  _mtime,
                  _mdate,
                  _crc32,
                  compressed_size,
                  uncompressed_size,
                  filename_length,
                  extra_length,
              ) = struct.unpack_from('<IHHHHHIIIHH', source, offset)

              if flags & 0x08:
                  raise RuntimeError('ZIP data descriptors are not supported by recovery workflow')

              name_start = offset + 30
              name_end = name_start + filename_length
              data_start = name_end + extra_length
              data_end = data_start + compressed_size
              if data_end > len(source):
                  break

              filename = source[name_start:name_end].decode('utf-8')
              if filename.startswith('/') or '..' in pathlib.PurePosixPath(filename).parts:
                  raise RuntimeError(f'Unsafe ZIP path: {filename}')

              compressed = source[data_start:data_end]
              if compression == 0:
                  payload = compressed
              elif compression == 8:
                  payload = zlib.decompress(compressed, -15)
              else:
                  raise RuntimeError(f'Unsupported ZIP compression method {compression} for {filename}')

              if len(payload) != uncompressed_size:
                  raise RuntimeError(f'Invalid recovered size for {filename}')

              output = target / filename
              if filename.endswith('/'):
                  output.mkdir(parents=True, exist_ok=True)
              else:
                  output.parent.mkdir(parents=True, exist_ok=True)
                  output.write_bytes(payload)
                  extracted.append(filename)

              offset = data_end

          print('Recovered files:')
          for filename in extracted:
              print(filename)
          if 'main.py' not in extracted:
              raise RuntimeError('main.py was not recoverable from the surviving ZIP prefix')
          PY

      - name: Apply recovered release files
        shell: bash
        run: |
          set -euo pipefail
          cp -a /tmp/mo_patch/unpacked/. ./
          python -m py_compile main.py
          python -m compileall -q .

      - name: Record release version
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '0.12.42' > VERSION

      - name: Commit recovered release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DevelopAid Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add main.py VERSION
          if git diff --cached --quiet; then
            echo 'Recovered files are already applied'
            exit 0
          fi
          git commit -m 'Recover MO calculator 0.12.42'
          git push
