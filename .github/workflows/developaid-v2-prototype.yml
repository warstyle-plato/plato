name: DevelopAid 2.0

on:
  pull_request:
    paths:
      - "developaid_v2.py"
      - "developaid_v2_result.py"
      - "developaid_v2_demo.py"
      - "developaid_v2_prototype_fixtures.py"
      - "excel_tep_sheet.py"
      - "frontend_v2/**"
      - "tests/test_developaid_v2.py"
      - "tests/test_developaid_v2_live_result.py"
      - "tests/test_excel_tep_sheet.py"
      - "main_registry.py"
      - ".github/workflows/developaid-v2-prototype.yml"
  workflow_dispatch:

jobs:
  v2-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest httpx
      - name: Compile modules
        run: >
          python -m py_compile developaid_v2.py developaid_v2_result.py
          developaid_v2_demo.py developaid_v2_prototype_fixtures.py
          excel_tep_sheet.py main_registry.py
      - name: Run v2 and Excel TEP tests
        run: >
          python -m pytest tests/test_developaid_v2.py
          tests/test_developaid_v2_live_result.py
          tests/test_excel_tep_sheet.py -q
