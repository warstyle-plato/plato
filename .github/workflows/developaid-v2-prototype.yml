name: DevelopAid 2.0 prototype

on:
  pull_request:
    paths:
      - "developaid_v2.py"
      - "frontend_v2/**"
      - "tests/test_developaid_v2.py"
      - "main_registry.py"
      - ".github/workflows/developaid-v2-prototype.yml"
  workflow_dispatch:

jobs:
  prototype-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile prototype modules
        run: python -m py_compile developaid_v2.py main_registry.py
      - name: Run prototype unit tests
        run: python -m unittest tests.test_developaid_v2 -v
