name: DevelopAid 2.0

on:
  pull_request:
    paths:
      - "developaid_v2.py"
      - "developaid_v2_result.py"
      - "frontend_v2/**"
      - "tests/test_developaid_v2.py"
      - "tests/test_developaid_v2_live_result.py"
      - "main_registry.py"
      - ".github/workflows/developaid-v2-prototype.yml"
  workflow_dispatch:

jobs:
  v2-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest httpx
      - name: Compile modules
        run: >
          python -m py_compile developaid_v2.py developaid_v2_result.py
          developaid_v2_upgrade.py developaid_v2_form.py main_registry.py
      - name: Run v2 tests
        run: python -m pytest tests/test_developaid_v2.py tests/test_developaid_v2_live_result.py -q
