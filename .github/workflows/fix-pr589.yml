name: Fix PR 589 golden after glossary merge
on:
  push:
    branches: [claude/tep-object-parking-sellable]
    paths: ['.github/workflows/fix-pr589.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/tep-object-parking-sellable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore sports to monetizable saleable and refresh golden
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('main_legacy.py')
          s=p.read_text('utf-8')
          old='_sold_objects = set(object_keys_of("standalone_retail", "offices"))'
          new='_sold_objects = set(object_keys_of("standalone_retail", "offices", "sports"))'
          assert s.count(old)==1, f'expected one target, got {s.count(old)}'
          p.write_text(s.replace(old,new), 'utf-8')
          PY
          python scripts/golden_snapshot.py --update --reason "PR #589 после #588: ТЭП объекта хранит площадь здания; продаваемая площадь standalone-объектов вычитает паркинг первых этажей, sports остаётся в monetizable saleable."
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main_legacy.py tests/golden
          git commit -m 'Fix PR 589 saleable denominator after glossary merge'
          git push origin HEAD:claude/tep-object-parking-sellable
