# Поиск секретов (gitleaks). Правила — штатные; здесь только исключения.
#
# Правило generic-api-key ловит любое длинное значение рядом со словом «key».
# В тестах так выглядят выдуманные ключи стенда (monkeypatch.setenv, заголовок
# X-…-Key), в справочниках — ключи объектов («key»: «имя-участка»). Ни один из
# них не совпадает со значением в коде приложения (проверено при аудите
# docs/security_audit_2026-10-23.md). Исключение снимает ТОЛЬКО это правило и
# ТОЛЬКО в этих папках: настоящий токен узнаваемого вида (Telegram, GitHub,
# OpenAI, AWS, приватный ключ) в тесте по-прежнему найдётся.
[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Выдуманные ключи стенда в тестах и ключи объектов в справочниках"
paths = ['''^tests/''', '''^reference_data/''']
