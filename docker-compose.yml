services:
  developaid:
    build: .
    restart: always
    env_file: .env
    # APP_BIND=127.0.0.1 закрывает приложение снаружи — так делают, когда
    # впереди стоит nginx с TLS. Для тестового стенда, который открывают
    # браузером по IP, нужен 0.0.0.0. Аутентификации у приложения нет:
    # порт наружу открывайте только на время теста и ограничивайте группой
    # безопасности Yandex Cloud.
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8080}:8000"
    volumes:
      # Справочники УПКС, Кср и Кд переживают пересборку образа.
      - ./data:/app/data
